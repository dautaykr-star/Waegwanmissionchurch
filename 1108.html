<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>묵상시대 · Meditation Era</title>
<style>
:root{--bg:#fbfaf7;--fg:#222;--mut:#6b6b6b;--ac:#1d5fa8;--bd:#e2dfd6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e6e6e6;--mut:#9aa0a6;--ac:#7db4f0;--bd:#2d3136}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 'Noto Sans KR','Noto Sans Khmer','Noto Sans Sinhala','Noto Sans Bengali','Noto Sans JP','Noto Sans SC','Malgun Gothic','Apple SD Gothic Neo','Nirmala UI','Khmer UI',sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:1.3rem;line-height:1.4}
#list section{margin:0 0 1.4em;padding-bottom:1.2em;border-bottom:1px solid var(--bd)}
#list .sec{font-size:1.05rem;margin:0 0 .4em;line-height:1.6}
#list .it{margin:.4em 0;padding-left:1.4em;text-indent:-1.4em;word-break:keep-all}
a{color:var(--ac);text-decoration:underline;text-underline-offset:3px}
#view h2{font-size:1.25rem;margin:.6em 0}
.v{margin:0 0 .9em;word-break:keep-all}
.n{color:var(--mut);font-size:.8em;margin-right:.4em}
button{font:inherit;background:none;border:1px solid var(--bd);color:var(--ac);border-radius:8px;padding:6px 14px;cursor:pointer}
#list .l{white-space:pre-wrap;word-break:keep-all;margin:.25em 0}
#list .l0{font-weight:700;margin-top:1.2em}
#list .l1{padding-left:1em}
#list .l2{padding-left:2em}
#list .sp{height:.5em}
#lg{font:inherit;font-size:.9rem;margin:0 0 .8em;padding:4px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
#view .note{color:var(--mut);font-size:.85rem;margin-top:1.5em}
</style>
</head>

<script>
var T="묵상시대, 나의 피 곧 언약의 피니라(마26:25-28)\n\n1.성찬이란 무엇인가? \n 1)세우신 언약\n  (1)예수님의 몸: 우리를 위한 희생(마26:26, 눅22:19, 사53:5, 고전15:3)  \n  (2)예수님의 피: 새 언약의 성취(마26:28, 눅22:20, 막10:45, 엡1:7 \n  (3)다시 오실 때까지 기억하고 선포하라(눅22:19, 마26:29, 고전11:26)\n 2)은혜를 누림\n  (1)대속하신 주님을 기억(갈2:20, 롬5:6,8, 10)  \n  (2)하나 된 교회를 회복(고전10:17, 엡4:3-6) \n  (3)다시 오실 주님을 기다리며 복음을 전달(고전11:26, 고후5:20, 고전4:1-2)  \n 3)맡겨진 사명\n  (1)기념하라 – 십자가의 구원을 잊지 말라(고전11:24-25)\n  (2)선포하라 – 주님의 죽으심을 다시 오실 때까지 전하라(고전11:26)\n  (3)분별하라 – 주님의 몸을 분별하고 합당하게 참여하라(고전11:27-29)\n\n2. 세례란 무엇인가?\n 1)완전한 구원\n  (1)죽으심에 연합하는 것(롬6:3, 갈2:20 , 골2:20) \n  (2)부활에 연합하는 것(롬6:4,골2:12, 엡2:5-6)  \n  (3)옛사람을 벗고 새사람으로 살아가는 것(롬6:6, 엡4:22-24, 골3:9-10  \n 2)완전한 신분\n  (1)사탄과 죄의 권세에서 해방된 자(롬8:1-2, 골1:13-14, 고전6:19-20) \n  (2)하나님의 자녀로 새로운 신분을 얻은 것(갈3:26-27, 롬8:15-16, 고후5:17)  \n  (3)그리스도 안에서 하나 된 공동체(고전12:13, 갈3:28, 엡4:4-6  \n 3)새로운 사명\n  (1)죄에 대하여 죽고 하나님께 대하여 산 자(롬6:11, 롬6:12-13, 갈5:16) \n  (2)그리스도의 마음과 삶을 따라가는 것(빌2:5, 골3:1-2, 고후5:15)\n  (3)충성된 일꾼으로 살아가는 것(고전4:1-2, 고후5:20, 엡3:7-9, 딤후2:2) \n\n3.나의 누릴 세례와 성찬 \n 1)12가지 근본문제 정복의 시간\n  (1)근본의 문제- 창3장(원죄), 창6장(네피림), 창11장(바벨탑)\n  (2)오래된 문제- 행13장(무속), 행16장(점술), 행19장(우상숭배) \n  (3)현재의 상태- 요8:44(종노릇), 출20:4-5(우상숭배), 마11:28(고통)\n                   행8:4-8(육신), 눅16:19-31(지옥), 마27:25(대물림)\n 2)모든 문제 해결 그리스도를 누리는 시간(고전2:1-2)\n  (1)선지자-요14:6    (2)제사장-롬8:1-2     (3)만왕의 왕-요일3:8\n 3)구원받은 사람의 실존-과거치유(옛사람), 현재치유(신분), 미래치유(증인)";
var D={
"마 26":"25 예수를 파는 유다가 대답하여 가로되 랍비여 내니이까 대답하시되 네가 말하였도다 하시니라\n26 저희가 먹을 때에 예수께서 떡을 가지사 축복하시고 떼어 제자들을 주시며 가라사대 받아 먹으라 이것이 내 몸이니라 하시고\n27 또 잔을 가지사 사례하시고 저희에게 주시며 가라사대 너희가 다 이것을 마시라\n28 이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 나의 피 곧 언약의 피니라\n29 그러나 너희에게 이르노니 내가 포도나무에서 난 것을 이제부터 내 아버지의 나라에서 새 것으로 너희와 함께 마시는 날까지 마시지 아니하리라 하시니라",
"눅 22":"19 또 떡을 가져 사례하시고 떼어 저희에게 주시며 가라사대 이것은 너희를 위하여 주는 내 몸이라 너희가 이를 행하여 나를 기념하라 하시고\n20 저녁 먹은 후에 잔도 이와 같이 하여 가라사대 이 잔은 내 피로 세우는 새 언약이니 곧 너희를 위하여 붓는 것이라",
"고전 15":"3 내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고",
"엡 1":"7 우리가 그리스도 안에서 그의 은혜의 풍성함을 따라 그의 피로 말미암아 구속 곧 죄 사함을 받았으니",
"고전 11":"24 축사하시고 떼어 가라사대 이것은 너희를 위하는 내 몸이니 이것을 행하여 나를 기념하라 하시고\n25 식후에 또한 이와 같이 잔을 가지시고 가라사대 이 잔은 내 피로 세운 새 언약이니 이것을 행하여 마실 때마다 나를 기념하라 하셨으니\n26 너희가 이 떡을 먹으며 이 잔을 마실 때마다 주의 죽으심을 오실 때까지 전하는 것이니라\n27 그러므로 누구든지 주의 떡이나 잔을 합당치 않게 먹고 마시는 자는 주의 몸과 피를 범하는 죄가 있느니라\n28 사람이 자기를 살피고 그 후에야 이 떡을 먹고 이 잔을 마실지니\n29 주의 몸을 분변치 못하고 먹고 마시는 자는 자기의 죄를 먹고 마시는 것이니라",
"갈 2":"20 내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 산 것이 아니요 오직 내 안에 그리스도께서 사신 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 몸을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라",
"롬 5":"6 우리가 아직 연약할 때에 기약대로 그리스도께서 경건치 않은 자를 위하여 죽으셨도다\n8 우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라\n10 곧 우리가 원수 되었을 때에 그 아들의 죽으심으로 말미암아 하나님으로 더불어 화목되었은즉 화목된 자로서는 더욱 그의 살으심을 인하여 구원을 얻을 것이니라",
"고전 10":"17 떡이 하나요 많은 우리가 한 몸이니 이는 우리가 다 한 떡에 참예함이라",
"엡 4":"3 평안의 매는 줄로 성령의 하나 되게 하신 것을 힘써 지키라\n4 몸이 하나이요 성령이 하나이니 이와 같이 너희가 부르심의 한 소망 안에서 부르심을 입었느니라\n5 주도 하나이요 믿음도 하나이요 세례도 하나이요\n6 하나님도 하나이시니 곧 만유의 아버지시라 만유 위에 계시고 만유를 통일하시고 만유 가운데 계시도다\n22 너희는 유혹의 욕심을 따라 썩어져 가는 구습을 좇는 옛 사람을 벗어 버리고\n23 오직 심령으로 새롭게 되어\n24 하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새 사람을 입으라",
"고후 5":"15 저가 모든 사람을 대신하여 죽으심은 산 자들로 하여금 다시는 저희 자신을 위하여 살지 않고 오직 저희를 대신하여 죽었다가 다시 사신 자를 위하여 살게 하려 함이니라\n17 그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새것이 되었도다\n20 이러므로 우리가 그리스도를 대신하여 사신이 되어 하나님이 우리로 너희를 권면하시는 것 같이 그리스도를 대신하여 간구하노니 너희는 하나님과 화목하라",
"고전 4":"1 사람이 마땅히 우리를 그리스도의 일군이요 하나님의 비밀을 맡은 자로 여길지어다\n2 그리고 맡은 자들에게 구할 것은 충성이니라",
"롬 6":"3 무릇 그리스도 예수와 합하여 세례를 받은 우리는 그의 죽으심과 합하여 세례 받은 줄을 알지 못하느뇨\n4 그러므로 우리가 그의 죽으심과 합하여 세례를 받음으로 그와 함께 장사되었나니 이는 아버지의 영광으로 말미암아 그리스도를 죽은 자 가운데서 살리심과 같이 우리로 또한 새 생명 가운데서 행하게 하려 함이니라\n5 만일 우리가 그의 죽으심을 본받아 연합한 자가 되었으면 또한 그의 부활을 본받아 연합한 자가 되리라\n6 우리가 알거니와 우리 옛 사람이 예수와 함께 십자가에 못 박힌 것은 죄의 몸이 멸하여 다시는 우리가 죄에게 종노릇하지 아니하려 함이니\n11 이와 같이 너희도 너희 자신을 죄에 대하여는 죽은 자요 그리스도 예수 안에서 하나님을 대하여는 산 자로 여길지어다\n12 그러므로 너희는 죄로 너희 죽을 몸에 왕 노릇 하지 못하게 하여 몸의 사욕을 순종치 말고\n13 또한 너희 지체를 불의의 병기로 죄에게 드리지 말고 오직 너희 자신을 죽은 자 가운데서 다시 산 자 같이 하나님께 드리며 너의 지체를 의의 병기로 하나님께 드리라",
"골 2":"12 너희가 세례로 그리스도와 함께 장사한 바 되고 또 죽은 자들 가운데서 그를 일으키신 하나님의 역사를 믿음으로 말미암아 그 안에서 함께 일으키심을 받았느니라\n20 너희가 세상의 초등 학문에서 그리스도와 함께 죽었거든 어찌하여 세상에 사는 것과 같이 의문에 순종하느냐",
"엡 2":"5 허물로 죽은 우리를 그리스도와 함께 살리셨고 (너희가 은혜로 구원을 얻은 것이라)\n6 또 함께 일으키사 그리스도 예수 안에서 함께 하늘에 앉히시니",
"골 3":"1 그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위엣 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라\n2 위엣 것을 생각하고 땅엣 것을 생각지 말라\n9 너희가 서로 거짓말을 말라 옛 사람과 그 행위를 벗어 버리고\n10 새 사람을 입었으니 이는 자기를 창조하신 자의 형상을 좇아 지식에까지 새롭게 하심을 받는 자니라",
"롬 8":"1 그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니\n2 이는 그리스도 예수 안에 있는 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였음이라\n15 너희는 다시 무서워하는 종의 영을 받지 아니하였고 양자의 영을 받았으므로 아바 아버지라 부르짖느니라\n16 성령이 친히 우리 영으로 더불어 우리가 하나님의 자녀인 것을 증거하시나니",
"골 1":"13 그가 우리를 흑암의 권세에서 건져내사 그의 사랑의 아들의 나라로 옮기셨으니\n14 그 아들 안에서 우리가 구속 곧 죄 사함을 얻었도다",
"고전 6":"19 너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희의 것이 아니라\n20 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라",
"갈 3":"26 너희가 다 믿음으로 말미암아 그리스도 예수 안에서 하나님의 아들이 되었으니\n27 누구든지 그리스도와 합하여 세례를 받은 자는 그리스도로 옷 입었느니라\n28 너희는 유대인이나 헬라인이나 종이나 자주자나 남자나 여자 없이 다 그리스도 예수 안에서 하나이니라",
"고전 12":"13 우리가 유대인이나 헬라인이나 종이나 자유자나 다 한 성령으로 세례를 받아 한 몸이 되었고 또 다 한 성령을 마시게 하셨느니라",
"갈 5":"16 내가 이르노니 너희는 성령을 좇아 행하라 그리하면 육체의 욕심을 이루지 아니하리라",
"빌 2":"5 너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니",
"엡 3":"7 이 복음을 위하여 그의 능력이 역사하시는 대로 내게 주신 하나님의 은혜의 선물을 따라 내가 일군이 되었노라\n8 모든 성도 중에 지극히 작은 자보다 더 작은 나에게 이 은혜를 주신 것은 측량할 수 없는 그리스도의 풍성을 이방인에게 전하게 하시고\n9 영원부터 만물을 창조하신 하나님 속에 감취었던 비밀의 경륜이 어떠한 것을 드러내게 하려 하심이라",
"딤후 2":"2 또 네가 많은 증인 앞에서 내게 들은 바를 충성된 사람들에게 부탁하라 저희가 또 다른 사람들을 가르칠 수 있으리라",
"고전 2":"1 형제들아 내가 너희에게 나아가 하나님의 증거를 전할 때에 말과 지혜의 아름다운 것으로 아니하였나니\n2 내가 너희 중에서 예수 그리스도와 그의 십자가에 못 박히신 것 외에는 아무 것도 알지 아니하기로 작정하였음이라",
"요 14":"6 예수께서 가라사대 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라",
"요일 3":"8 죄를 짓는 자는 마귀에게 속하나니 마귀는 처음부터 범죄함이니라 하나님의 아들이 나타나신 것은 마귀의 일을 멸하려 하심이니라",
"마 27":"25 백성이 다 대답하여 가로되 그 피를 우리와 우리 자손에게 돌릴지어다 하거늘",
"사 53":"5 그가 찔림은 우리의 허물을 인함이요 그가 상함은 우리의 죄악을 인함이라 그가 징계를 받음으로 우리가 평화를 누리고 그가 채찍에 맞음으로 우리가 나음을 입었도다",
"막 10":"45 인자의 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라",
"요 8":"44 너희는 너희 아비 마귀에게서 났으니 너희 아비의 욕심을 너희도 행하고자 하느니라 저는 처음부터 살인한 자요 진리가 그 속에 없으므로 진리에 서지 못하고 거짓을 말할 때마다 제 것으로 말하나니 이는 저가 거짓말장이요 거짓의 아비가 되었음이니라",
"출 20":"4 너를 위하여 새긴 우상을 만들지 말고 또 위로 하늘에 있는 것이나 아래로 땅에 있는 것이나 땅아래 물속에 있는 것의 아무 형상이든지 만들지 말며\n5 그것들에게 절하지 말며 그것들을 섬기지 말라 나 여호와 너의 하나님은 질투하는 하나님인즉 나를 미워하는 자의 죄를 갚되 아비로부터 아들에게로 삼 사대까지 이르게 하거니와",
"마 11":"28 수고하고 무거운 짐진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라",
"행 8":"4 그 흩어진 사람들이 두루 다니며 복음의 말씀을 전할쌔\n5 빌립이 사마리아 성에 내려가 그리스도를 백성에게 전파하니\n6 무리가 빌립의 말도 듣고 행하는 표적도 보고 일심으로 그의 말하는 것을 좇더라\n7 많은 사람에게 붙었던 더러운 귀신들이 크게 소리를 지르며 나가고 또 많은 중풍병자와 앉은뱅이가 나으니\n8 그 성에 큰 기쁨이 있더라",
"눅 16":"19 한 부자가 있어 자색 옷과 고운 베옷을 입고 날마다 호화로이 연락하는데\n20 나사로라 이름한 한 거지가 헌데를 앓으며 그 부자의 대문에 누워\n21 부자의 상에서 떨어지는 것으로 배불리려 하매 심지어 개들이 와서 그 헌데를 핥더라\n22 이에 그 거지가 죽어 천사들에게 받들려 아브라함의 품에 들어가고 부자도 죽어 장사되매\n23 저가 음부에서 고통 중에 눈을 들어 멀리 아브라함과 그의 품에 있는 나사로를 보고\n24 불러 가로되 아버지 아브라함이여 나를 긍휼히 여기사 나사로를 보내어 그 손가락 끝에 물을 찍어 내 혀를 서늘하게 하소서 내가 이 불꽃 가운데서 고민하나이다\n25 아브라함이 가로되 얘 너는 살았을 때에 네 좋은 것을 받았고 나사로는 고난을 받았으니 이것을 기억하라 이제 저는 여기서 위로를 받고 너는 고민을 받느니라\n26 이뿐 아니라 너희와 우리 사이에 큰 구렁이 끼어 있어 여기서 너희에게 건너가고자 하되 할 수 없고 거기서 우리에게 건너 올 수도 없게 하였느니라\n27 가로되 그러면 구하노니 아버지여 나사로를 내 아버지의 집에 보내소서\n28 내 형제 다섯이 있으니 저희에게 증거하게 하여 저희로 이 고통 받는 곳에 오지 않게 하소서\n29 아브라함이 가로되 저희에게 모세와 선지자들이 있으니 그들에게 들을찌니라\n30 가로되 그렇지 아니하니이다 아버지 아브라함이여 만일 죽은 자에게서 저희에게 가는 자가 있으면 회개하리이다\n31 가로되 모세와 선지자들에게 듣지 아니하면 비록 죽은 자 가운데서 살아나는 자가 있을찌라도 권함을 받지 아니하리라 하였다 하시니라",
// 위 7개 본문은 앞서 제공된 텍스트(1,2번 자료)에서 가져옴
"창 3":"1 여호와 하나님의 지으신 들짐승 중에 뱀이 가장 간교하더라 뱀이 여자에게 물어 가로되 하나님이 참으로 너희더러 동산 모든 나무의 실과를 먹지 말라 하시더냐\n2 여자가 뱀에게 말하되 동산 나무의 실과를 우리가 먹을 수 있으나\n3 동산 중앙에 있는 나무의 실과는 하나님의 말씀에 너희는 먹지도 말고 만지지도 말라 너희가 죽을까 하노라 하셨느니라\n4 뱀이 여자에게 이르되 너희가 결코 죽지 아니하리라\n5 너희가 그것을 먹는 날에는 너희 눈이 밝아 하나님과 같이 되어 선악을 알 줄을 하나님이 아심이니라\n6 여자가 그 나무를 본즉 먹음직도 하고 보암직도 하고 지혜롭게 할 만큼 탐스럽기도 한 나무인지라 여자가 그 실과를 따먹고 자기와 함께한 남편에게도 주매 그도 먹은지라\n7 이에 그들의 눈이 밝아 자기들의 몸이 벗은 줄을 알고 무화과 나무 잎을 엮어 치마를 하였더라\n8 그들이 날이 서늘할 때에 동산에 거니시는 여호와 하나님의 음성을 듣고 아담과 그 아내가 여호와 하나님의 낯을 피하여 동산 나무 사이에 숨은지라\n9 여호와 하나님이 아담을 부르시며 그에게 이르시되 네가 어디 있느냐\n10 가로되 내가 동산에서 하나님의 소리를 듣고 내가 벗었으므로 두려워하여 숨었나이다\n11 가라사대 누가 너의 벗었음을 네게 고하였느냐 내가 너더러 먹지 말라 명한 그 나무 실과를 네가 먹었느냐\n12 아담이 가로되 하나님이 주셔서 나와 함께 하게 하신 여자 그가 그 나무 실과를 내게 주므로 내가 먹었나이다\n13 여호와 하나님이 여자에게 이르시되 네가 어찌하여 이렇게 하였느냐 여자가 가로되 뱀이 나를 꾀므로 내가 먹었나이다\n14 여호와 하나님이 뱀에게 이르시되 네가 이렇게 하였으니 네가 모든 육축과 들의 모든 짐승보다 더욱 저주를 받아 배로 다니고 종신토록 흙을 먹을지니라\n15 내가 너로 여자와 원수가 되게 하고 너의 후손도 여자의 후손과 원수가 되게 하리니 여자의 후손은 네 머리를 상하게 할 것이요 너는 그의 발꿈치를 상하게 할 것이니라 하시고\n16 또 여자에게 이르시되 내가 네게 잉태하는 고통을 크게 더하리니 네가 수고하고 자식을 낳을 것이며 너는 남편을 사모하고 남편은 너를 다스릴 것이니라 하시고\n17 아담에게 이르시되 네가 네 아내의 말을 듣고 내가 너더러 먹지 말라 한 나무 실과를 먹었은즉 땅은 너로 인하여 저주를 받고 너는 종신토록 수고하여야 그 소산을 먹으리라\n18 땅이 네게 가시덤불과 엉겅퀴를 낼 것이라 너의 먹을 것은 밭의 채소인즉\n19 네가 얼굴에 땀이 흘러야 식물을 먹고 필경은 흙으로 돌아 가리니 그 속에서 네가 취함을 입었음이라 너는 흙이니 흙으로 돌아갈 것이니라 하시니라\n20 아담이 그 아내를 하와라 이름하였으니 그는 모든 산 자의 어미가 됨이더라\n21 여호와 하나님이 아담과 그 아내를 위하여 가죽옷을 지어 입히시니라\n22 여호와 하나님이 가라사대 보라 이 사람이 선악을 아는 일에 우리 중 하나 같이 되었으니 그가 그 손을 들어 생명나무 실과도 따 먹고 영생할까 하노라 하시고\n23 여호와 하나님이 에덴 동산에서 그 사람을 내어 보내어 그의 근본된 토지를 갈게 하시니라\n24 이같이 하나님이 그 사람을 쫓아 내시고 에덴 동산 동편에 그룹들과 두루 도는 화염검을 두어 생명나무의 길을 지키게 하시니라",
"창 6":"1 사람이 땅 위에 번성하기 시작할 때에 그들에게서 딸들이 나니\n2 하나님의 아들들이 사람의 딸들의 아름다움을 보고 자기들의 좋아하는 모든 자로 아내를 삼는지라\n3 여호와께서 가라사대 나의 신이 영원히 사람과 함께 하지 아니하리니 이는 그들이 육체가 됨이라 그러나 그들의 날은 일백이십 년이 되리라 하시니라\n4 당시에 땅에 네피림이 있었고 그 후에도 하나님의 아들들이 사람의 딸들을 취하여 자식을 낳았으니 그들이 용사라 고대에 유명한 사람이었더라\n5 여호와께서 사람의 죄악이 세상에 관영함과 그 마음의 생각의 모든 계획이 항상 악할 뿐임을 보시고\n6 땅 위에 사람 지으셨음을 한탄하사 마음에 근심하시고\n7 가라사대 나의 창조한 사람을 내가 지면에서 쓸어버리되 사람으로부터 육축과 기는 것과 공중의 새까지 그리하리니 이는 내가 그것을 지었음을 한탄함이니라 하시니라\n8 그러나 노아는 여호와께 은혜를 입었더라\n9 노아의 사적은 이러하니라 노아는 의인이요 당세에 완전한 자라 그가 하나님과 동행하였으며\n10 그가 세 아들을 낳았으니 셈과 함과 야벳이라\n11 때에 온 땅이 하나님 앞에 패괴하여 강포가 땅에 충만한지라\n12 하나님이 보신즉 땅이 패괴하였으니 이는 땅에서 모든 혈육 있는자의 행위가 패괴함이었더라\n13 하나님이 노아에게 이르시되 모든 혈육 있는 자의 강포가 땅에 가득하므로 그 끝날이 내 앞에 이르렀으니 내가 그들을 땅과 함께 멸하리라\n14 너는 잣나무로 너를 위하여 방주를 짓되 그 안에 간들을 막고 역청으로 그 안팎에 칠하라\n15 그 방주의 제도는 이러하니 장이 삼백 규빗, 광이 오십 규빗, 고가 삼십 규빗이며\n16 거기 창을 내되 위에서부터 한 규빗에 내고 그 문은 옆으로 내고 상 중 하 삼층으로 할지니라\n17 내가 홍수를 땅에 일으켜 무릇 생명의 기식 있는 육체를 천하에서 멸절하리니 땅에 있는 자가 다 죽으리라\n18 그러나 너와는 내가 내 언약을 세우리니 너는 네 아들들과 네 아내와 네 자부들과 함께 그 방주로 들어가고\n19 혈육 있는 모든 생물을 너는 각기 암 수 한쌍씩 방주로 이끌어 들여 너와 함께 생명을 보존케 하되\n20 새가 그 종류대로, 육축이 그 종류대로, 땅에 기는 모든 것이 그 종류대로, 각기 둘씩 네게로 나아오리니 그 생명을 보존케하라\n21 너는 먹을 모든 식물을 네게로 가져다가 저축하라 이것이 너와 그들의 식물이 되리라\n22 노아가 그와 같이 하되 하나님이 자기에게 명하신 대로 다 준행하였더라",
"창 11":"1 온 땅의 구음이 하나이요 언어가 하나이었더라\n2 이에 그들이 동방으로 옮기다가 시날 평지를 만나 거기 거하고\n3 서로 말하되 자, 벽돌을 만들어 견고히 굽자 하고 이에 벽돌로 돌을 대신하며 역청으로 진흙을 대신하고\n4 또 말하되 자, 성과 대를 쌓아 대 꼭대기를 하늘에 닿게 하여 우리 이름을 내고 온 지면에 흩어짐을 면하자 하였더니\n5 여호와께서 인생들의 쌓는 성과 대를 보시려고 강림하셨더라\n6 여호와께서 가라사대 이 무리가 한 족속이요 언어도 하나이므로 이같이 시작하였으니 이후로는 그 경영하는 일을 금지할 수 없으리로다\n7 자, 우리가 내려가서 거기서 그들의 언어를 혼잡케 하여 그들로 서로 알아듣지 못하게 하자 하시고\n8 여호와께서 거기서 그들을 온 지면에 흩으신 고로 그들이 성 쌓기를 그쳤더라\n9 그러므로 그 이름을 바벨이라 하니 이는 여호와께서 거기서 온 땅의 언어를 혼잡케 하셨음이라 여호와께서 거기서 그들을 온 지면에 흩으셨더라\n10 셈의 후예는 이러하니라 셈은 일백 세 곧 홍수 후 이 년에 아르박삿을 낳았고\n11 아르박삿을 낳은 후에 오백 년을 지내며 자녀를 낳았으며\n12 아르박삿은 삼십오 세에 셀라를 낳았고\n13 셀라를 낳은 후에 사백삼 년을 지내며 자녀를 낳았으며\n14 셀라는 삼십 세에 에벨을 낳았고\n15 에벨을 낳은 후에 사백삼 년을 지내며 자녀를 낳았으며\n16 에벨은 삼십사 세에 벨렉을 낳았고\n17 벨렉을 낳은 후에 사백삼십 년을 지내며 자녀를 낳았으며\n18 벨렉은 삼십 세에 르우를 낳았고\n19 르우를 낳은 후에 이백구 년을 지내며 자녀를 낳았으며\n20 르우는 삼십이 세에 스룩을 낳았고\n21 스룩을 낳은 후에 이백칠 년을 지내며 자녀를 낳았으며\n22 스룩은 삼십 세에 나홀을 낳았고\n23 나홀을 낳은 후에 이백 년을 지내며 자녀를 낳았으며\n24 나홀은 이십구 세에 데라를 낳았고\n25 데라를 낳은 후에 일백십구 년을 지내며 자녀를 낳았으며\n26 데라는 칠십 세에 아브람과 나홀과 하란을 낳았더라\n27 데라의 후예는 이러하니라 데라는 아브람과 나홀과 하란을 낳았고 하란은 롯을 낳았으며\n28 하란은 그 아비 데라보다 먼저 본토 갈대아 우르에서 죽었더라\n29 아브람과 나홀이 장가 들었으니 아브람의 아내 이름은 사래며 나홀의 아내 이름은 밀가니 하란의 딸이요 하란은 밀가의 아비며 또 이스가의 아비더라\n30 사래는 잉태하지 못하므로 자식이 없었더라\n31 데라가 그 아들 아브람과 하란의 아들 그 손자 롯과 그 자부 아브람의 아내 사래를 데리고 갈대아 우르에서 떠나 가나안 땅으로 가고자 하더니 하란에 이르러 거기 거하였으며\n32 데라는 이백오 세를 향수하고 하란에서 죽었더라",

var BIB_DATA={"en": {"마 26": "25 Then Judas, who betrayed him, answered and said, “Rabbi, is it I?” He said to him, “You have said so.”\n26 While they were eating, Jesus took bread, blessed it, broke it, and gave it to the disciples, saying, “Take, eat; this is my body.”\n27 And he took a cup, gave thanks, and gave it to them, saying, “Drink from it, all of you;\n28 for this is my blood of the covenant, which is poured out for many for the forgiveness of sins.”", "고전 11": "26 For as often as you eat this bread and drink this cup, you proclaim the Lord’s death until he comes."}, "vi": {"마 26": "25 Giu-đa, kẻ phản Ngài, thưa rằng: Thưa thầy, có phải con không? Ngài đáp: Chính con đã nói vậy.\n26 Đang khi ăn, Đức Chúa Giê-xu lấy bánh, chúc phước, bẻ ra, đưa cho môn đồ và phán rằng: Hãy cầm lấy mà ăn; này là thân thể Ta.\n27 Rồi Ngài lấy chén, tạ ơn, đưa cho môn đồ và phán rằng: Hết thảy các con hãy uống chén này;\n28 vì đây là huyết Ta, huyết của giao ước, đổ ra cho nhiều người để được tha tội.", "고전 11": "26 Vì mỗi khi anh em ăn bánh này và uống chén này, anh em rao truyền sự chết của Chúa cho đến khi Ngài đến."}, "zh": {"마 26": "25 卖耶稣的犹大回答说：“拉比，是我吗？”耶稣对他说：“你说的是。”\n26 他们吃的时候，耶稣拿起饼来，祝福，擘开，递给门徒，说：“你们拿着吃，这是我的身体。”\n27 又拿起杯来，祝谢了，递给他们，说：“你们都喝这个，\n28 因为这是我立约的血，为许多人流出来，使罪得赦。”", "고전 11": "26 你们每逢吃这饼，喝这杯，是表明主的死，直等到他来。"}, "ja": {"마 26": "25 イエスを裏切ったユダが答えて言った。「先生、まさか私ではないでしょう。」イエスは言われた。「あなたが言ったとおりです。」\n26 一同が食事をしているとき、イエスはパンを取り、祝福して裂き、弟子たちに与えて言われた。「取って食べなさい。これはわたしの体です。」\n27 また杯を取り、感謝を捧げて、彼らに与えて言われた。「みな、この杯から飲みなさい。\n28 これは、罪の赦しのために多くの人のために流される、わたしの契約の血です。」", "고전 11": "26 あなたがたは、このパンを食べこの杯を飲むたびに、主が来られるまで、主の死を告げ知らせるのです。"}, "km": {"마 26": "25 យូដាសដែលក្បត់ព្រះអង្គ ទូលតបថា៖ «រ៉ាប៊ី តើគឺទូលបង្គំឬ?» ព្រះយេស៊ូវមានព្រះបន្ទូលទៅគាត់ថា៖ «អ្នកបាននិយាយហើយ»។\n26 កាលកំពុងបរិភោគ ព្រះយេស៊ូវយកនំបុ័ង សូមព្រះពរ កាច់ ហើយប្រទានដល់ពួកសិស្ស មានព្រះបន្ទូលថា៖ «ចូរយកទៅបរិភោគចុះ នេះជារូបកាយរបស់ខ្ញុំ»។\n27 រួចព្រះអង្គយកពែង អរព្រះគុណ ហើយប្រទានដល់ពួកគេ មានព្រះបន្ទូលថា៖ «ចូរបានផឹកពីពែងនេះទាំងអស់គ្នា\n28 ដ្បិតនេះជាឈាមរបស់ខ្ញុំ គឺជាឈាមនៃសេចក្តីសញ្ញា ដែលត្រូវបង្ហូរសម្រាប់មនុស្សជាច្រើន ដើម្បីឲ្យបានអត់ទោសបាប»។", "고전 11": "26 ដ្បិតរាល់ពេលដែលអ្នករាល់គ្នាបរិភោគនំបុ័ងនេះ ហើយផឹកពែងនេះ នោះអ្នករាល់គ្នាប្រកាសពីការសុគតរបស់ព្រះអម្ចាស់ រហូតដល់ព្រះអង្គយាងមក។"}, "id": {"마 26": "25 Yudas, yang mengkhianati Dia, menjawab: “Rabi, bukan aku, bukan?” Kata Yesus kepadanya: “Engkau telah mengatakannya.”\n26 Pada waktu mereka sedang makan, Yesus mengambil roti, mengucap berkat, memecah-mecahkannya, lalu memberikannya kepada murid-murid-Nya dan berkata: “Ambillah, makanlah, inilah tubuh-Ku.”\n27 Sesudah itu Ia mengambil cawan, mengucap syukur, lalu memberikannya kepada mereka dan berkata: “Minumlah, kamu semua, dari cawan ini.\n28 Sebab inilah darah-Ku, darah perjanjian, yang ditumpahkan bagi banyak orang untuk pengampunan dosa.”", "고전 11": "26 Sebab setiap kali kamu makan roti ini dan minum cawan ini, kamu memberitakan kematian Tuhan sampai Ia datang."}, "si": {"마 26": "25 ජේසුස්වහන්සේව පාවා දුන් යූදස් පිළිතුරු දෙමින්, “රබ්බි, ඒ මා ද?” කීවේය. උන්වහන්සේ ඔහුට, “ඔබ ම එය කීවා” යැයි වදාළ සේක.\n26 ඔවුන් අනුභව කරමින් සිටියදී ජේසුස්වහන්සේ රොටි ගෙන, ආශීර්වාද කර, කඩා, ගෝලයන්ට දෙමින්, “ගෙන අනුභව කරන්න; මේ මාගේ සිරුරයි” යැයි වදාළ සේක.\n27 ඉන්පසු කුසලානය ගෙන, ස්තුති කර, ඔවුන්ට දෙමින්, “ඔබ සැවොම මෙයින් පානය කරන්න.\n28 මක්නිසාද මෙය බොහෝ දෙනා වෙනුවෙන් පව් සමාව පිණිස වැගිරෙන මාගේ ගිවිසුමේ ලේ ය” යැයි වදාළ සේක.", "고전 11": "26 මක්නිසාද ඔබ මේ රොටිය අනුභව කර මේ කුසලානයෙන් පානය කරන සෑම විටම, ස්වාමින්වහන්සේ එනතුරු උන්වහන්සේගේ මරණය ප්‍රකාශ කරන්නහුය."}, "bn": {"마 26": "25 যীশুকে যে বিশ্বাসঘাতকতা করছিল সেই যিহূদা উত্তরে বলল, “রব্বি, সে কি আমি?” তিনি তাকে বললেন, “তুমিই বললে।”\n26 তারা যখন খাচ্ছিল, যীশু রুটি নিয়ে আশীর্বাদ করলেন, ভাঙলেন এবং শিষ্যদের দিয়ে বললেন, “নাও, খাও; এটি আমার দেহ।”\n27 পরে তিনি পানপাত্র নিয়ে ধন্যবাদ দিলেন এবং তাদের দিয়ে বললেন, “তোমরা সবাই এ থেকে পান করো,\n28 কারণ এটি আমার রক্ত, নিয়মের রক্ত, যা অনেকের জন্য পাপের ক্ষমার জন্য ঢালা হচ্ছে।”", "고전 11": "26 কারণ যতবার তোমরা এই রুটি খাও এবং এই পানপাত্র থেকে পান করো, ততবার প্রভুর মৃত্যু তিনি আসা পর্যন্ত ঘোষণা করো।"}};

(function(){var R=[["en", "마 26", 29, "I tell you, I will not drink again of this fruit of the vine from now on until that day when I drink it new with you in my Father’s kingdom."], ["en", "눅 22", 19, "And he took bread, gave thanks, broke it, and gave it to them, saying, “This is my body, which is given for you. Do this in remembrance of me.”"], ["en", "눅 22", 20, "In the same way he took the cup after supper, saying, “This cup is the new covenant in my blood, which is poured out for you.”"], ["en", "고전 11", 24, "and when he had given thanks, he broke it and said, “This is my body, which is for you. Do this in remembrance of me.”"], ["en", "고전 11", 25, "In the same way he also took the cup after supper, saying, “This cup is the new covenant in my blood. Do this, as often as you drink it, in remembrance of me.”"], ["en", "고전 11", 27, "Therefore whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty of sinning against the body and blood of the Lord."], ["en", "고전 11", 28, "Let a person examine himself, and then eat of the bread and drink of the cup."], ["en", "고전 11", 29, "For the one who eats and drinks without discerning the body eats and drinks his own sin."], ["vi", "마 26", 29, "Nhưng Ta nói cùng các con: từ nay Ta sẽ không uống trái nho này nữa, cho đến ngày Ta uống mới với các con trong nước của Cha Ta."], ["vi", "눅 22", 19, "Ngài lại lấy bánh, tạ ơn, bẻ ra, đưa cho họ và phán rằng: Này là thân thể Ta, vì các con mà phó cho; hãy làm điều này để nhớ đến Ta."], ["vi", "눅 22", 20, "Cũng vậy, sau bữa ăn, Ngài lấy chén và phán rằng: Chén này là giao ước mới trong huyết Ta, đổ ra vì các con."], ["vi", "고전 11", 24, "Ngài tạ ơn rồi bẻ ra và phán rằng: Này là thân thể Ta vì các con; hãy làm điều này để nhớ đến Ta."], ["vi", "고전 11", 25, "Cũng vậy, sau bữa ăn, Ngài lấy chén và phán rằng: Chén này là giao ước mới trong huyết Ta; mỗi khi uống, hãy làm điều này để nhớ đến Ta."], ["vi", "고전 11", 27, "Vì vậy, ai ăn bánh hay uống chén của Chúa cách không xứng đáng thì phạm tội với thân thể và huyết của Chúa."], ["vi", "고전 11", 28, "Mỗi người hãy tự xét mình, rồi mới ăn bánh này và uống chén này."], ["vi", "고전 11", 29, "Vì ai ăn uống mà không phân biệt thân thể Chúa thì ăn uống tội lỗi cho chính mình."], ["zh", "마 26", 29, "我告诉你们，从今以后，我不再喝这葡萄树的出产，直到我在我父的国里同你们喝新的那日子。"], ["zh", "눅 22", 19, "又拿起饼来，祝谢了，擘开，递给他们，说：“这是我的身体，为你们舍的，你们应当如此行，为的是记念我。”"], ["zh", "눅 22", 20, "饭后也照样拿起杯来，说：“这杯是用我的血所立的新约，是为你们流出来的。”"], ["zh", "고전 11", 24, "祝谢了，就擘开，说：“这是我的身体，为你们舍的，你们应当如此行，为的是记念我。”"], ["zh", "고전 11", 25, "饭后，也照样拿起杯来，说：“这杯是用我的血所立的新约，你们每逢喝的时候，要如此行，为的是记念我。”"], ["zh", "고전 11", 27, "所以，无论何人，不按理吃主的饼，喝主的杯，就是干犯主的身体和血了。"], ["zh", "고전 11", 28, "人应当自己省察，然后吃这饼，喝这杯。"], ["zh", "고전 11", 29, "因为人吃喝，若不分辨是主的身体，就是吃喝自己的罪了。"], ["ja", "마 26", 29, "あなたがたに言っておく。わたしは、わたしの父の国であなたがたと共に新しく飲むその日まで、今から後、このぶどうの実から造ったものを飲むことはもう決してありません。"], ["ja", "눅 22", 19, "またパンを取り、感謝して裂き、彼らに与えて言われた。「これは、あなたがたのために与えられるわたしの体です。わたしを記念して、これを行いなさい。」"], ["ja", "눅 22", 20, "食事の後、杯も同じようにして言われた。「この杯は、わたしの血による新しい契約です。あなたがたのために流されるものです。」"], ["ja", "고전 11", 24, "感謝して裂き、言われた。「これは、あなたがたのためのわたしの体です。わたしを記念して、これを行いなさい。」"], ["ja", "고전 11", 25, "食事の後、同じように杯を取って言われた。「この杯は、わたしの血による新しい契約です。飲むたびに、わたしを記念して、これを行いなさい。」"], ["ja", "고전 11", 27, "ですから、ふさわしくないままでパンを食べ、主の杯を飲む者は、主の体と血に対して罪を犯すことになります。"], ["ja", "고전 11", 28, "人はまず自分を吟味し、そうしてからこのパンを食べ、この杯を飲みなさい。"], ["ja", "고전 11", 29, "主の体をわきまえずに飲み食いする者は、自分の罪を飲み食いすることになるからです。"], ["km", "마 26", 29, "ប៉ុន្តែខ្ញុំប្រាប់អ្នករាល់គ្នាថា ចាប់ពីពេលនេះតទៅ ខ្ញុំនឹងមិនផឹកផលនៃទំពាំងបាយជូរនេះទៀតឡើយ រហូតដល់ថ្ងៃដែលខ្ញុំផឹកថ្មីជាមួយអ្នករាល់គ្នានៅក្នុងនគរនៃព្រះវរបិតារបស់ខ្ញុំ។"], ["km", "눅 22", 19, "ព្រះអង្គក៏យកនំបុ័ង អរព្រះគុណ កាច់ ហើយប្រទានដល់ពួកគេ មានព្រះបន្ទូលថា៖ «នេះជារូបកាយរបស់ខ្ញុំ ដែលប្រទានសម្រាប់អ្នករាល់គ្នា ចូរធ្វើដូច្នេះ ដើម្បីរំលឹកដល់ខ្ញុំ»។"], ["km", "눅 22", 20, "ក្រោយបរិភោគរួច ព្រះអង្គក៏យកពែងដូចគ្នា មានព្រះបន្ទូលថា៖ «ពែងនេះជាសេចក្តីសញ្ញាថ្មីក្នុងឈាមរបស់ខ្ញុំ ដែលត្រូវបង្ហូរសម្រាប់អ្នករាល់គ្នា»។"], ["km", "고전 11", 24, "កាលព្រះអង្គអរព្រះគុណរួច ក៏កាច់នំបុ័ង មានព្រះបន្ទូលថា៖ «នេះជារូបកាយរបស់ខ្ញុំ សម្រាប់អ្នករាល់គ្នា ចូរធ្វើដូច្នេះ ដើម្បីរំលឹកដល់ខ្ញុំ»។"], ["km", "고전 11", 25, "ក្រោយបរិភោគរួច ព្រះអង្គក៏យកពែងដូចគ្នា មានព្រះបន្ទូលថា៖ «ពែងនេះជាសេចក្តីសញ្ញាថ្មីក្នុងឈាមរបស់ខ្ញុំ រាល់ពេលដែលអ្នករាល់គ្នាផឹក ចូរធ្វើដូច្នេះ ដើម្បីរំលឹកដល់ខ្ញុំ»។"], ["km", "고전 11", 27, "ដូច្នេះ អ្នកណាដែលបរិភោគនំបុ័ង ឬផឹកពែងរបស់ព្រះអម្ចាស់ដោយមិនសមនឹងទទួល អ្នកនោះមានទោសក្នុងរូបកាយ និងព្រះលោហិតរបស់ព្រះអម្ចាស់។"], ["km", "고전 11", 28, "ចូរឲ្យម្នាក់ៗពិនិត្យខ្លួនឯងសិន រួចទើបបរិភោគនំបុ័ងនេះ ហើយផឹកពីពែងនេះ។"], ["km", "고전 11", 29, "ដ្បិតអ្នកណាដែលបរិភោគ ហើយផឹក ដោយមិនពិចារណាអំពីរូបកាយរបស់ព្រះអម្ចាស់ អ្នកនោះបរិភោគ ហើយផឹកបាបដល់ខ្លួនឯង។"], ["id", "마 26", 29, "Tetapi Aku berkata kepadamu: mulai sekarang Aku tidak akan minum lagi hasil pohon anggur ini sampai pada hari Aku meminumnya yang baru bersama-sama kamu di dalam Kerajaan Bapa-Ku."], ["id", "눅 22", 19, "Lalu Ia mengambil roti, mengucap syukur, memecah-mecahkannya, dan memberikannya kepada mereka, kata-Nya: “Inilah tubuh-Ku yang diserahkan bagi kamu; perbuatlah ini untuk mengingat Aku.”"], ["id", "눅 22", 20, "Demikian juga Ia mengambil cawan sesudah makan, kata-Nya: “Cawan ini adalah perjanjian baru dalam darah-Ku, yang ditumpahkan bagi kamu.”"], ["id", "고전 11", 24, "dan sesudah mengucap syukur, Ia memecah-mecahkannya dan berkata: “Inilah tubuh-Ku, yang diserahkan bagi kamu; perbuatlah ini untuk mengingat Aku.”"], ["id", "고전 11", 25, "Demikian juga Ia mengambil cawan sesudah makan, kata-Nya: “Cawan ini adalah perjanjian baru dalam darah-Ku; perbuatlah ini setiap kali kamu meminumnya, untuk mengingat Aku.”"], ["id", "고전 11", 27, "Jadi barangsiapa makan roti atau minum cawan Tuhan secara tidak layak, ia berdosa terhadap tubuh dan darah Tuhan."], ["id", "고전 11", 28, "Hendaklah setiap orang menguji dirinya sendiri, dan baru sesudah itu ia makan roti ini dan minum dari cawan ini."], ["id", "고전 11", 29, "Sebab barangsiapa makan dan minum tanpa mengakui tubuh Tuhan, ia makan dan minum dosa bagi dirinya sendiri."], ["si", "마 26", 29, "නමුත් මම ඔබට කියමි: මෙතැන් පටන් මාගේ පියාණන්ගේ රාජ්‍යයේ ඔබ සමඟ අලුතින් පානය කරන දිනය දක්වා මේ මිදි වැලේ පල මම නැවත පානය නොකරමි."], ["si", "눅 22", 19, "ඉන්පසු උන්වහන්සේ රොටි ගෙන, ස්තුති කර, කඩා, ඔවුන්ට දෙමින්, “මේ ඔබ වෙනුවෙන් දෙන මාගේ සිරුරයි; මා සිහි කිරීම පිණිස මෙය කරන්න” යැයි වදාළ සේක."], ["si", "눅 22", 20, "එලෙසම රාත්‍රී භෝජනයෙන් පසු කුසලානයද ගෙන, “මේ කුසලානය ඔබ වෙනුවෙන් වැගිරෙන මාගේ ලේවලින් වූ නව ගිවිසුමයි” යැයි වදාළ සේක."], ["si", "고전 11", 24, "උන්වහන්සේ ස්තුති කර, එය කඩා, “මේ ඔබ වෙනුවෙන් වූ මාගේ සිරුරයි; මා සිහි කිරීම පිණිස මෙය කරන්න” යැයි වදාළ සේක."], ["si", "고전 11", 25, "එලෙසම රාත්‍රී භෝජනයෙන් පසු කුසලානයද ගෙන, “මේ කුසලානය මාගේ ලේවලින් වූ නව ගිවිසුමයි; ඔබ පානය කරන සෑම විටම මා සිහි කිරීම පිණිස මෙය කරන්න” යැයි වදාළ සේක."], ["si", "고전 11", 27, "එබැවින් ස්වාමින්වහන්සේගේ රොටිය අනුභව කරන හෝ කුසලානයෙන් පානය කරන කවරෙකු හෝ අයෝග්‍ය ලෙස එසේ කළොත් ස්වාමින්වහන්සේගේ සිරුරට හා ලේවලට විරුද්ධව පව් කරන්නෙකි."], ["si", "고전 11", 28, "එබැවින් මිනිසා පළමුව තමාම පරීක්ෂා කර බලා, ඉන්පසු මේ රොටිය අනුභව කර මේ කුසලානයෙන් පානය කරත්වා."], ["si", "고전 11", 29, "මක්නිසාද ස්වාමින්වහන්සේගේ සිරුර වටහා නොගෙන අනුභව කර පානය කරන තැනැත්තා තමාට ම පව් අනුභව කර පානය කරයි."], ["bn", "마 26", 29, "কিন্তু আমি তোমাদের বলছি, এখন থেকে আমার পিতার রাজ্যে তোমাদের সাথে নতুনভাবে পান করার সেই দিন পর্যন্ত আমি এই আঙুরলতার ফল আর পান করব না।"], ["bn", "눅 22", 19, "তারপর তিনি রুটি নিয়ে ধন্যবাদ দিলেন, ভাঙলেন এবং তাদের দিয়ে বললেন, “এটি আমার দেহ, যা তোমাদের জন্য দেওয়া হচ্ছে; আমার স্মরণে এটি করো।”"], ["bn", "눅 22", 20, "একইভাবে খাওয়ার পর তিনি পানপাত্র নিয়ে বললেন, “এই পানপাত্র আমার রক্তে নতুন নিয়ম, যা তোমাদের জন্য ঢালা হচ্ছে।”"], ["bn", "고전 11", 24, "তিনি ধন্যবাদ দিয়ে তা ভাঙলেন এবং বললেন, “এটি তোমাদের জন্য আমার দেহ; আমার স্মরণে এটি করো।”"], ["bn", "고전 11", 25, "একইভাবে খাওয়ার পর তিনি পানপাত্র নিয়ে বললেন, “এই পানপাত্র আমার রক্তে নতুন নিয়ম; যতবার পান করবে, আমার স্মরণে এটি করো।”"], ["bn", "고전 11", 27, "অতএব যে কেউ অযোগ্যভাবে প্রভুর রুটি খায় বা পানপাত্র থেকে পান করে, সে প্রভুর দেহ ও রক্তের বিরুদ্ধে পাপী হবে।"], ["bn", "고전 11", 28, "প্রত্যেকে নিজেকে পরীক্ষা করুক, তারপর এই রুটি খাক ও এই পানপাত্র থেকে পান করুক।"], ["bn", "고전 11", 29, "কারণ যে দেহকে না চিনে খায় ও পান করে, সে নিজের জন্য পাপই খায় ও পান করে।"]];R.forEach(function(r){addB(r[0],r[1],r[2],r[3])})})();

var BK="요일|요|창|출|사|겔|마|막|눅|행|롬|고전|고후|갈|엡|골|히|딤후|딤전|벧전|약|계|살후|살전|시|빌|렘|잠";
var RE=new RegExp("("+BK+") ?(\\d+)(?:(장)|:(\\d+)(?:-(\\d+))?)|(,\\s?)(\\d+)(?:-(\\d+))?(?![\\d:장])","g");
var N={"창 3":24,"창 6":22,"창 11":32};
var AL={kh:"km",cn:"zh",kr:"ko",jp:"ja",vn:"vi","in":"id",lk:"si",bd:"bn"};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function conv(x,fn){var lb="",lc="",lj=false;return x.replace(RE,function(m,b,c,j,v1,v2,cm,n,n2){
  var ref;
  if(b){lb=b;lc=c;lj=!!j;ref=j?b+" "+c+"장":b+" "+c+":"+v1+(v2?"-"+v2:"");return fn(ref,m)}
  if(!lb||lj)return m;
  ref=lb+" "+lc+":"+n+(n2?"-"+n2:"");return cm+fn(ref,m.slice(cm.length))})}
function lookup(ref,src){
  src=src||D;
  var m=/^(\S+) (\d+)(?:장|:(\d+)(?:-(\d+))?)$/.exec(ref); if(!m)return null;
  var key=m[1]+" "+m[2],ch=src[key]; if(!ch)return null;
  var map={};ch.split("\n").forEach(function(l){var i=l.indexOf(" ");map[l.slice(0,i)]=l.slice(i+1)});
  var a,b,out=[];
  if(/장$/.test(ref)){if(!N[key])return null;a=1;b=N[key]}else{a=+m[3];b=+(m[4]||m[3])}
  for(var v=a;v<=b;v++){if(!map[v])return null;out.push([v,map[v]])}
  return out;
}
function disp(ref,lang){
  if(lang==="ko")return ref.replace(" ","");
  var m=/^(\S+) (\d+)(.*)$/.exec(ref);return EB[m[1]]+" "+m[2]+(m[3]==="장"?"":m[3]);
}
var TL=T.split("\n"),GR={},NB=[];
var RG=new RegExp("(\\((?:"+BK+") ?\\d[^)]*\\)?)\\s*$");
TL.forEach(function(l,i){var m=RG.exec(l);if(m)GR[i]=m[1];if(l.trim())NB.push(i)});
function lineText(i,lang){
  if(lang==="ko")return TL[i];
  var t=TR[lang][NB.indexOf(i)];
  if(t.indexOf("{G}")>=0){var g=(GR[i]||"").trim();if((g.match(/\(/g)||[]).length>(g.match(/\)/g)||[]).length)g+=")";t=t.replace("{G}",g)}
  return t;
}
function refsFor(lang){var r=[];TL.forEach(function(l,i){if(l.trim())conv(lineText(i,lang),function(x){r.push(x);return ""})});return r}
function refs(){return refsFor("ko")}
function normLang(c){if(!c)return null;c=String(c).toLowerCase().split(/[-_]/)[0];c=AL[c]||c;return LN.indexOf(c)>=0?c:null}
function checkLangs(){var base=refsFor("ko").join("|"),o={};LN.forEach(function(l){o[l]=refsFor(l).join("|")===base});return o}
if(typeof document!=="undefined"){
  var L=document.getElementById("list"),V=document.getElementById("view"),saved=0,pushed=false,lang="ko",curRef="";
  var SEL=document.createElement("select");SEL.id="lg";SEL.setAttribute("aria-label","Language");
  LN.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=UI[c].name;SEL.appendChild(o)});
  L.parentNode.insertBefore(SEL,L);
  SEL.onchange=function(){setLang(SEL.value)};
  function lk(x){return conv(esc(x),function(r,t){return '<a href="#'+encodeURIComponent(r)+'" data-r="'+r+'">'+(lang==="ko"?t:disp(r,lang))+'</a>'})}
  function renderList(){
    var html="";
    for(var i=0;i<TL.length;i++){
      if(!TL[i].trim()){html+='<div class="sp"></div>';continue}
      var t=lineText(i,lang).replace(/^ +/,"");

  }
  function showList(){curRef="";V.hidden=true;L.hidden=false;window.scrollTo(0,saved)}

  function setLang(c){

  });
  function sync(){
    var h=(history.state&&history.state.r)||"";

  }
  window.addEventListener("popstate",sync);
  window.addEventListener("hashchange",sync);
  window.addEventListener("storage",function(e){if(e.key==="lang")setLang(e.newValue)});
  window.addEventListener("message",function(e){var d=e.data;if(d&&d.type==="setLang")setLang(d.lang)});
  window.addEventListener("langchange",function(e){var d=e.detail;setLang(d&&d.lang||d)});
  try{new MutationObserver(function(){setLang(document.documentElement.lang)}).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]})}catch(e){}
  if("scrollRestoration" in history)history.scrollRestoration="manual";
  var q=null,st=null;try{q=new URLSearchParams(location.search).get("lang")}catch(e){}
  try{st=localStorage.getItem("lang")}catch(e){}
  lang=normLang(q)||normLang(st)||normLang(document.documentElement.lang)||normLang(navigator.language)||"ko";
  L.lang=lang;V.lang=lang;SEL.value=lang;renderList();sync();
}
if(typeof module!=="undefined")module.exports={refs:refs,lookup:lookup,checkLangs:checkLangs,D:D};
