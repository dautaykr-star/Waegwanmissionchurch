<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>묵상시대, 대대의 영원한 규례</title>
<style>
:root{--bg:#fbfaf7;--fg:#222;--mut:#6b6b6b;--ac:#1d5fa8;--bd:#e2dfd6;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e6e6e6;--mut:#9aa0a6;--ac:#7db4f0;--bd:#2d3136}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.8 'Noto Sans KR','Noto Sans Khmer','Noto Sans Sinhala','Noto Sans Bengali','Noto Sans JP','Noto Sans SC','Malgun Gothic','Apple SD Gothic Neo','Nirmala UI','Khmer UI',sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:1.3rem;line-height:1.4}
#list section{margin:0 0 1.4em;padding-bottom:1.2em;border-bottom:1px solid var(--bd)}
#list .sec{font-size:1.05rem;margin:0 0 .4em;line-height:1.6}
#list .it{margin:.4em 0;padding-left:1.4em;text-indent:-1.4em;word-break:keep-all}
a{color:var(--ac);text-decoration:underline;text-underline-offset:3px}
#view h2{font-size:1.25rem;margin:.6em 0}
.v{margin:0 0 .9em;word-break:keep-all}
.n{color:var(--mut);font-size:.8em;margin-right:.4em}
button{font:inherit;background:none;border:1px solid var(--bd);color:var(--ac);border-radius:8px;padding:6px 14px;cursor:pointer}
#list .l{white-space:pre-wrap;word-break:keep-all;margin:.25em 0}
#list .l0{font-weight:700;margin-top:1.2em}
#list .l1{padding-left:1em}
#list .l2{padding-left:2em}
#list .sp{height:.5em}
#lg{font:inherit;font-size:.9rem;margin:0 0 .8em;padding:4px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
#view .note{color:var(--mut);font-size:.85rem;margin-top:1.5em}
.v .gap{color:var(--mut)}
</style>
</head>
<body>
<main>
<div id="list"></div>
<div id="view" hidden></div>
</main>
<script>
var T="묵상시대, 대대의 영원한 규례(레23:39-44)\n\n1.영원한 규례의 증인\n 1)노아-창8:20(번제)\n 2)아브라함-창13:18(제단)\n 3)이삭-창26:25(장막)\n 4)야곱-창35:1(벧엘 제단)\n 5)요셉-창50:24(가나안)\n 6)이스라엘-출3:18(희생제사)\n 7)사무엘-삼상7:10(번제)\n 8)다윗-삼하24:25(번제, 화목제)\n 9)솔로몬-왕상3:4(일천번제)\n 10)히스기야-왕하18:3\n 11)초대교회-행2:1-47\n\n2.대대의 영원한 규례-레23:33-44\n 1)구원-유월절\n  (1)피 언약을 잊지 말라-창3:15, 출3:18\n  (2)임마누엘, 죄 사함, 마귀세력을 이기는 답\n  (3)복음 체질이 되는 절기\n  (4)잊으면 창3장에서 못 빠져 나온다\n 2)인도-오순절\n  (1)잠3:3-5 범사에 그를 인정하라\n  (2)막3:13-15 함께하신다는 약속\n  (3)마28:20세상 끝 날 까지\n  (4)고전10:13  피할 길\n  (5)행1:8, 2:1  땅 끝까지 증인으로\n 3)나라-추수절\n  (1)마4:1-11사단의 시험\n  (2)마12:28-29 사단 결박\n  (3)행1:3-5, 8 하나님나라, 성령충만\n  (4)행19:8-10  말씀운동\n  (5)빌4:20 하나님께 영광\n  (6)요14:3 천국\n\n3.영원한 규례의 축복\n 1)말씀-하나님의 말씀이 들려지는 시간(딤후3:16-17)\n  (1)말씀, 메시지, 복음의 비밀 전달\n  (2)하나님의 중심, 계획, 뜻 전달\n  (3)하나님의 감동의 전달\n 2)기도-말씀잡고 기도하는 시간(시1:1-6, 갈5:16-21)\n  (1)육신의 일을 내려놓고 하나님을 바라보는 시간\n  (2)성령충만의 열매(갈5:22)\n  (3)말씀 묵상, 이미 주신응답을 누리는 시간\n 3)찬양-평화와 능력이 임하는 시간\n  (1)삼상16:23-악신결박\n  (2)대하20:22-대적정복\n  (3)살전5:18-범사에 감사";
var D={
"레 23":"33 여호와께서 모세에게 말씀하여 이르시되\n34 이스라엘 자손에게 말하여 이르라 일곱째 달 열닷샛날은 초막절이니 여호와를 위하여 이레 동안 지킬 것이라\n35 첫 날에는 성회로 모일지니 너희는 아무 노동도 하지 말지며\n36 이레 동안에 너희는 여호와께 화제를 드릴 것이요 여덟째 날에도 너희는 성회로 모여서 여호와께 화제를 드릴지니 이는 거룩한 대회라 너희는 어떤 노동도 하지 말지니라\n37 이것들은 여호와의 절기라 너희는 공포하여 성회를 열고 여호와께 화제를 드릴지니 번제와 소제와 회생제물과 전제를 각각 그 날에 드릴지니\n38 이는 여호와의 안식일 외에, 너희의 헌물 외에, 너희의 모든 서원제물 외에 또 너희의 모든 자원제물 외에 너희가 여호와께 드리는 것이니라\n39 너희가 토지 소산 거두기를 마치거든 일곱째 달 열닷샛날부터 이레 동안 여호와의 절기를 지키되 첫 날에도 안식하고 여덟째 날에도 안식할 것이요\n40 첫 날에는 너희가 아름다운 나무 실과와 종려나무 가지와 무성한 나무 가지와 시내 버들을 취하여 너희의 하나님 여호와 앞에서 이레 동안 즐거워할 것이라\n41 너희는 매년 이레 동안 여호와께 이 절기를 지킬지니 너희 대대의 영원한 규례라 너희는 일곱째 달에 이를 지킬지니라\n42 너희는 이레 동안 초막에 거주하되 이스라엘에서 난 자는 다 초막에 거주할지니\n43 이는 내가 이스라엘 자손을 애굽 땅에서 인도하여 내던 때에 초막에 거주하게 한 줄을 너희 대대로 알게 함이니라 나는 너희의 하나님 여호와이니라\n44 모세는 이와 같이 여호와의 절기를 이스라엘 자손에게 공포하였더라",
"창 8":"20 노아가 여호와께 제단을 쌓고 모든 정결한 짐승과 모든 정결한 새 중에서 제물을 취하여 번제로 제단에 드렸더니",
"창 13":"18 이에 아브람이 장막을 옮겨 헤브론에 있는 마므레 상수리 수풀에 이르러 거주하며 거기서 여호와를 위하여 제단을 쌓았더라",
"창 26":"25 이삭이 그곳에 제단을 쌓고, 여호와의 이름을 부르며 거기 장막을 쳤더니 이삭의 종들이 거기서도 우물을 팠더라",
"창 35":"1 하나님이 야곱에게 이르시되 일어나 벧엘로 올라가서 거기 거주하며 네가 네 형 에서의 낯을 피하여 도망하던 때에 네게 나타났던 하나님께 거기서 제단을 쌓으라 하신지라",
"창 50":"24 요셉이 그의 형제들에게 이르되 나는 죽을 것이나 하나님이 당신들을 돌보시고 당신들을 이 땅에서 인도하여 내사 아브라함과 이삭과 야곱에게 맹세하신 땅에 이르게 하시리라 하고",
"출 3":"18 그들이 네 말을 들으리니 너는 그들의 장로들과 함께 애굽 왕에게 이르기를 히브리 사람의 하나님 여호와께서 우리에게 임하셨은즉 우리가 우리 하나님 여호와께 제사를 드리려 하오니 사흘길쯤 광야로 가도록 허락하소서 하라",
"삼상 7":"10 사무엘이 번제를 드릴 때에 블레셋 사람이 이스라엘과 싸우려고 가까이 오매 그 날에 여호와께서 블레셋 사람에게 큰 우레를 발하여 그들을 어지럽게 하시니 그들이 이스라엘 앞에 패한지라",
"삼하 24":"25 그 곳에서 여호와를 위하여 제단을 쌓고 번제와 화목제를 드렸더니 이에 여호와께서 그 땅을 위한 기도를 들으시매 이스라엘에게 내리는 재앙이 그쳤더라",
"왕상 3":"4 이에 왕이 제사하러 기브온으로 가니 거기는 산당이 큼이라 솔로몬이 그 제단에 일천 번제를 드렸더니",
"왕하 18":"3 히스기야가 그의 조상 다윗의 모든 행위와 같이 여호와께서 보시기에 정직하게 행하여",
"행 2":"1 오순절 날이 이미 이르매 그들이 다같이 한 곳에 모였더니\n2 홀연히 하늘로부터 급하고 강한 바람 같은 소리가 있어 그들이 앉은 온 집에 가득하며\n3 마치 불의 혀처럼 갈라지는 것들이 그들에게 보여 각 사람 위에 하나씩 임하여 있더니\n4 그들이 다 성령의 충만함을 받고 성령이 말하게 하심을 따라 다른 언어들로 말하기를 시작하니라\n5 그 때에 경건한 유대인들이 천하 각국으로부터 와서 예루살렘에 머물러 있더니\n6 이 소리가 나매 큰 무리가 모여 각각 자기의 방언으로 제자들이 말하는 것을 듣고 소동하여\n7 다 놀라 신기하게 여겨 이르되 보라 이 말하는 사람들이 다 갈릴리 사람이 아니냐\n8 우리가 우리 각 사람이 난 곳 방언으로 듣게 되는 것이 어찌 됨이냐\n9 우리는 바대인과 메대인과 엘람인과 또 메소보다미아, 유대와 갑바도기아, 본도와 아시아\n10 브루기아와 밤빌리아, 애굽과 및 구레네에 가까운 리비야 여러 지방에 사는 사람들과 로마로부터 온 나그네 곧 유대인과 유대교에 들어온 사람들과\n11 그레데인과 아라비아인들이라 우리가 다 우리의 각 언어로 하나님의 큰 일을 말함을 듣는도다 하고\n12 다 놀라며 당황하여 서로 이르되 이 어찌 된 일이냐 하며\n13 또 어떤 이들은 조롱하여 이르되 그들이 새 술에 취하였다 하더라\n14 베드로가 열한 사도와 함께 서서 소리를 높여 이르되 유대인들과 예루살렘에 사는 모든 사람들아 이 일을 너희로 알게 할 것이니 내 말에 귀를 기울이라\n15 때가 제 삼 시니 너희 생각과 같이 이 사람들이 취한 것이 아니라\n16 이는 곧 선지자 요엘을 통하여 말씀하신 것이니 일렀으되\n17 하나님이 말씀하시기를 말세에 내가 내 영을 모든 육체에 부어 주리니 너희의 자녀들은 예언할 것이요 너희의 젊은이들은 환상을 보고 너희의 늙은이들은 꿈을 꾸리라\n18 그 때에 내가 내 영을 내 남종과 여종들에게 부어 주리니 그들이 예언할 것이요\n19 또 내가 위로 하늘에서는 기사를 아래로 땅에서는 징조를 베풀리니 곧 피와 불과 연기로다\n20 주의 크고 영화로운 날이 이르기 전에 해가 변하여 어두워지고 달이 변하여 피가 되리라\n21 누구든지 주의 이름을 부르는 자는 구원을 받으리라 하였느니라\n22 이스라엘 사람들아 이 말을 들으라 너희도 아는 바와 같이 하나님께서 나사렛 예수로 큰 권능과 기사와 표적을 너희 가운데서 베푸사 너희 앞에서 그를 증언하셨느니라\n23 그가 하나님께서 정하신 뜻과 미리 아신 대로 내준 바 되었거늘 너희가 법 없는 자들의 손을 빌려 못 박아 죽였으나\n24 하나님께서 그를 사망의 고통에서 풀어 살리셨으니 이는 그가 사망에 매여 있을 수 없었음이라\n26 그러므로 내 마음이 기뻐하였고 내 혀도 즐거워하였으며 육체도 희망에 거하리니\n27 이는 내 영혼을 음부에 버리지 아니하시며 주의 거룩한 자로 썩음을 당하지 않게 하실 것임이로다\n28 주께서 생명의 길을 내게 보이셨으니 주 앞에서 내게 기쁨이 충만하게 하시리로다 하였으므로\n29 형제들아 내가 조상 다윗에 대하여 담대히 말할 수 있노니 다윗이 죽어 장사되어 그 묘가 오늘까지 우리 중에 있도다\n30 그는 선지자라 하나님이 이미 맹세하사 그 자손 중에서 한 사람을 그 위에 앉게 하리라 하심을 알고\n31 미리 본 고로 그리스도의 부활을 말하되 그가 음부에 버림이 되지 않고 그의 육신이 썩음을 당하지 아니하시리라 하더니\n32 이 예수를 하나님이 살리신지라 우리가 다 이 일에 증인이로다\n33 하나님이 오른손으로 예수를 높이시매 그가 약속하신 성령을 아버지께 받아서 너희가 보고 듣는 이것을 부어 주셨느니라\n34 다윗은 하늘에 올라가지 못하였으나 친히 말하여 이르되 주께서 내 주에게 말씀하시기를\n35 내가 네 원수로 네 발등상이 되게 하기까지 너는 내 우편에 앉아 있으라 하셨도다\n36 그런즉 이스라엘 온 집은 확실히 알지니 너희가 십자가에 못 박은 이 예수를 하나님이 주와 그리스도가 되게 하셨느니라 하니라\n37 그들이 이 말을 듣고 마음에 찔려 베드로와 다른 사도들에게 물어 이르되 형제들아 우리가 어찌 할꼬 하거늘\n38 베드로가 이르되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 받으라 그리하면 성령의 선물을 받으리니\n39 이 약속은 너희와 너희 자녀와 모든 먼 데 사람 곧 주 우리 하나님이 얼마든지 부르시는 자들에게 하신 것이라 하고\n40 또 여러 말로 확증하며 권하여 이르되 너희가 이 패역한 세대에서 구원을 받으라 하니\n41 그 말을 받은 사람들은 세례를 받으매 이 날에 신도의 수가 삼천이나 더하더라\n42 그들이 사도의 가르침을 받아 서로 교제하고 떡을 떼며 오로지 기도하기를 힘쓰니라\n43 사람마다 두려워하는데 사도들로 말미암아 기사와 표적이 많이 나타나니\n44 믿는 사람이 다 함께 있어 모든 물건을 서로 통용하고\n45 또 재산과 소유를 팔아 각 사람의 필요를 따라 나눠 주며\n46 날마다 마음을 같이하여 성전에 모이기를 힘쓰고 집에서 떡을 떼며 기쁨과 순전한 마음으로 음식을 먹고\n47 하나님을 찬미하며 또 온 백성에게 칭송을 받으니 주께서 구원 받는 사람을 날마다 더하게 하시니라",

"레 23":"33 Đức Giê-hô-va lại phán với Môi-se:\n34 “Con hãy truyền bảo dân Y-sơ-ra-ên rằng: ‘Ngày rằm tháng bảy nầy là lễ Lều Tạm và sẽ kéo dài bảy ngày để tôn kính Đức Giê-hô-va.\n35 Ngày thứ nhất là ngày hội họp thánh, các con không được làm bất cứ công việc thường ngày nào cả.\n36 Mỗi ngày trong bảy ngày, các con phải dùng lửa dâng các lễ vật lên Đức Giê-hô-va. Đến ngày thứ tám các con lại có một cuộc hội họp thánh nữa và cũng dùng lửa dâng các lễ vật lên Đức Giê-hô-va. Đây là một lễ hội trọng thể, các con không được làm một công việc thường ngày nào cả.\n37 Đó là các lễ trọng thể của Đức Giê-hô-va mà các con phải công bố như là những kỳ hội họp thánh để dâng lên Đức Giê-hô-va những lễ vật dâng bằng lửa, tế lễ thiêu, tế lễ chay, tế lễ bình an, và lễ quán, lễ nào theo ngày nấy.\n38 Ngoài ra, các con còn phải giữ những ngày sa-bát của Đức Giê-hô-va, các lễ vật, các tế lễ hứa nguyện và tự nguyện dâng lên Đức Giê-hô-va.\n39 Vậy, vào ngày rằm tháng bảy, sau khi thu hoạch thổ sản, các con phải giữ một lễ cho Đức Giê-hô-va trong bảy ngày. Ngày thứ nhất sẽ là ngày nghỉ và ngày thứ tám sau kỳ lễ cũng là ngày nghỉ.\n40 Ngày thứ nhất các con phải chọn các loại trái như cam chanh, các cành chà là, các nhánh cây đầy lá, và những cành liễu mọc bên suối, rồi liên hoan suốt bảy ngày trước mặt Giê-hô-va Đức Chúa Trời của các con.\n41 Mỗi năm, vào tháng bảy các con phải giữ lễ nầy cho Đức Giê-hô-va trong bảy ngày. Đây là quy định đời đời cho mọi thế hệ của các con.\n42 Các con phải ở trong lều bảy ngày. Tất cả những người sinh ra là dân Y-sơ-ra-ên đều phải ở trong lều,\n43 để mọi thế hệ các con biết rằng khi Ta đem dân Y-sơ-ra-ên ra khỏi Ai Cập, Ta đã cho họ ở trong các lều trại. Ta là Giê-hô-va Đức Chúa Trời của các con.’”\n44 Vậy Môi-se truyền dạy cho dân Y-sơ-ra-ên biết giữ các ngày lễ Đức Giê-hô-va đã ấn định.",

"행 2":"1 Đến ngày lễ Ngũ Tuần, các môn đồ nhóm họp tại một chỗ.\n2 Thình lình, có tiếng động từ trời đến như tiếng gió thổi ào ào, đầy khắp nhà môn đồ ngồi.\n3 Các môn đồ thấy những lưỡi như lưỡi lửa xuất hiện, tản ra và đậu trên mỗi người trong họ.\n4 Tất cả đều được đầy dẫy Đức Thánh Linh, bắt đầu nói các ngôn ngữ khác, theo như Thánh Linh cho họ nói.\n5 Bấy giờ có những người Do Thái sùng đạo từ các dân trong thiên hạ về, đang lưu trú tại Giê-ru-sa-lem.\n6 Khi nghe tiếng ấy, dân chúng kéo đến và sửng sốt vì mỗi người đều nghe các môn đồ nói tiếng bản xứ của mình.\n7 Họ rất ngạc nhiên và hỏi nhau: “Tất cả những người đang nói đó không phải là người Ga-li-lê sao?\n8 Vậy sao mỗi người chúng ta đều nghe họ nói tiếng bản xứ của mình?\n9 Nào người Bạt-thê, Mê-đi, Ê-la-mít, kẻ ở tại Mê-sô-pô-ta-mi, Giu-đê, Cáp-pa-đốc, Pông, A-si-a,\n10 Phi-ri-gi, Pam-phi-ly, Ai Cập, các vùng thuộc Li-by gần Sy-ren; nào du khách từ Rô-ma đến,\n11 cả người Do Thái hoặc người theo đạo Do Thái, người Cơ-rết và Ả-rập nữa, chúng ta đều nghe họ dùng ngôn ngữ chúng ta mà nói về những việc quyền năng của Đức Chúa Trời.”\n12 Mọi người đều kinh ngạc và bối rối, nói với nhau: “Việc nầy có nghĩa gì?”\n13 Nhưng có kẻ lại chế giễu rằng: “Họ say rượu mới rồi đó.”\n14 Nhưng Phi-e-rơ đứng với mười một sứ đồ, lên tiếng nói với dân chúng: “Thưa anh em là người Do Thái và tất cả những người ở Giê-ru-sa-lem! Hãy biết rõ điều nầy và lắng tai nghe lời tôi nói:\n15 Những người nầy chẳng phải say như anh em tưởng đâu, vì bây giờ mới là chín giờ sáng ban ngày!\n16 Nhưng đây là điều Chúa đã phán qua nhà tiên tri Giô-ên:\n17 ‘Đức Chúa Trời phán: Trong những ngày cuối cùng, Ta sẽ đổ Thánh Linh Ta trên mọi xác thịt; Con trai và con gái các ngươi sẽ nói tiên tri, Thanh niên sẽ thấy khải tượng, Và người già sẽ thấy chiêm bao.\n18 Phải, trong những ngày đó, Ta sẽ đổ Thánh Linh Ta trên các đầy tớ trai và gái Ta, Và họ sẽ nói tiên tri;\n19 Ta lại sẽ làm các phép mầu ở trên trời, Và dấu lạ ở dưới đất; tức là máu, lửa, và luồng khói;\n20 Mặt trời sẽ trở nên tối tăm, Mặt trăng sẽ hóa ra máu, Trước ngày vĩ đại và vinh quang của Chúa đến.\n21 Và ai cầu khẩn danh Chúa thì sẽ được cứu.’\n22 Thưa đồng bào Y-sơ-ra-ên, xin hãy nghe tôi nói đây: Đức Chúa Jêsus người Na-xa-rét đã được Đức Chúa Trời xác chứng trước anh em bằng những việc quyền năng, các phép mầu và dấu lạ. Qua Ngài, Đức Chúa Trời đã thực hiện những điều đó giữa anh em như chính anh em đều biết rõ.\n23 Ngài đã bị phản nộp theo kế hoạch đã định và sự biết trước của Đức Chúa Trời, các ông đã mượn tay những kẻ gian ác đóng đinh Ngài trên thập tự giá và giết đi.\n24 Nhưng Đức Chúa Trời đã khiến Ngài sống lại, giải thoát Ngài khỏi nỗi thống khổ của sự chết, vì nó không thể cầm giữ Ngài được.\n25 Bởi Đa-vít có nói về Ngài: ‘Tôi luôn thấy Chúa ở trước mặt tôi, Vì Ngài ở bên phải tôi, nên tôi không hề bị rúng động.\n26 Do đó, lòng tôi vui vẻ, lưỡi tôi mừng rỡ, Và thể xác tôi cũng sẽ an nghỉ trong hi vọng.\n27 Vì Chúa sẽ không bỏ linh hồn tôi nơi âm phủ, Cũng không để cho Đấng Thánh của Ngài thấy sự hư nát.\n28 Chúa đã cho tôi biết con đường sự sống, Cũng sẽ khiến tôi tràn đầy niềm vui trước mặt Ngài.’\n29 Thưa anh em, tôi có thể nói quả quyết với anh em rằng tổ phụ Đa-vít là người đã chết, được an táng và hiện nay ngôi mộ của người vẫn còn ở giữa chúng ta.\n30 Nhưng người là một nhà tiên tri, biết Đức Chúa Trời đã thề hứa rằng Ngài sẽ đặt một người thuộc dòng dõi người ngồi trên ngai mình.\n31 Do đó, người đã thấy trước và nói về sự sống lại của Đấng Christ rằng: Ngài chẳng bị bỏ nơi âm phủ, Thân thể Ngài chẳng thấy sự rữa nát.\n32 Đức Chúa Trời đã khiến Đức Chúa Jêsus nầy sống lại; tất cả chúng tôi đều làm nhân chứng về điều đó.\n33 Vậy sau khi đã được tôn cao ở bên phải Đức Chúa Trời và đã nhận lãnh lời hứa về Đức Thánh Linh từ nơi Cha, Ngài đổ Đức Thánh Linh ra như anh em đang thấy và nghe.\n34 Vì vua Đa-vít chẳng hề lên trời, nhưng chính người có nói: ‘Chúa đã phán với Chúa tôi rằng: Hãy ngồi bên phải Ta,\n35 Cho đến khi nào Ta đặt các kẻ thù con làm bệ chân cho con.’\n36 Vì thế, cả nhà Y-sơ-ra-ên hãy biết chắc chắn rằng Đức Chúa Jêsus nầy, Đấng mà anh em đã đóng đinh trên thập tự giá, đã được Đức Chúa Trời tôn làm Chúa và Đấng Christ.”\n37 Khi nghe điều ấy, lòng đau như cắt, họ liền hỏi Phi-e-rơ và các sứ đồ khác rằng: “Các anh ơi, chúng tôi phải làm gì đây?”\n38 Phi-e-rơ trả lời: “Hãy ăn năn, mỗi người phải nhân danh Đức Chúa Jêsus nhận báp-têm để được tha tội mình, rồi sẽ nhận lãnh quà tặng là Đức Thánh Linh.\n39 Vì lời hứa đó dành cho anh em, cho con cháu anh em, và cho tất cả mọi người ở xa, tức là tất cả những người mà Chúa là Đức Chúa Trời chúng ta sẽ kêu gọi.”\n40 Phi-e-rơ lại lấy nhiều lời làm chứng mà thúc giục họ rằng: “Anh em hãy cứu lấy mình thoát khỏi thế hệ gian tà nầy!”\n41 Vậy, những người tiếp nhận lời đó đều nhận báp-têm, và trong ngày ấy, có độ ba nghìn người thêm vào Hội Thánh.\n42 Các tín hữu chuyên tâm giữ lời dạy của các sứ đồ, mối thông công với anh em, lễ bẻ bánh, và sự cầu nguyện.\n43 Mọi người đều kính sợ vì có nhiều phép mầu và dấu lạ được thực hiện qua các sứ đồ.\n44 Tất cả tín hữu đều hiệp lại với nhau và lấy mọi vật làm của chung.\n45 Họ bán hết tài sản, của cải mình có mà phân phát cho nhau tùy theo nhu cầu của mỗi người.\n46 Ngày nào họ cũng chuyên tâm đến đền thờ; và từ nhà nầy đến nhà khác, họ bẻ bánh và dùng bữa cùng nhau với lòng vui vẻ, chân thành,\n47 ca ngợi Đức Chúa Trời và được ơn trước mặt mọi người. Mỗi ngày, Chúa thêm số người được cứu vào Hội Thánh.",
"창 3":"15 Ta sẽ làm cho mầy và người nữ, Dòng dõi mầy và dòng dõi người nữ thù nghịch nhau. Người sẽ giày đạp đầu mầy, Còn mầy sẽ cắn gót chân người.”",
"잠 3":"3 Đừng để sự nhân từ và sự chân thật lìa bỏ con; Hãy đeo nó vào cổ, Ghi nó nơi bia lòng con.\n4 Như vậy trước mặt Đức Chúa Trời và loài người, Con sẽ tìm được ân huệ và sự khôn ngoan thật.\n5 Hãy hết lòng tin cậy Đức Giê-hô-va, Đừng nương cậy nơi sự thông sáng của con.",
"막 3":"13 Đức Chúa Jêsus đi lên núi, gọi những người Ngài muốn, và họ đến với Ngài.\n14 Ngài lập mười hai người, gọi là sứ đồ, để ở với Ngài, sai họ đi truyền giảng,\n15 và ban cho họ thẩm quyền đuổi quỷ.",
"마 28":"20 và dạy họ giữ mọi điều Ta đã truyền cho các con. Và nầy, Ta luôn ở với các con cho đến tận thế.”",
"고전 10":"13 Những thử thách đến với anh em, chẳng có điều nào quá sức loài người. Đức Chúa Trời là Đấng thành tín, Ngài không để anh em bị thử thách quá sức mình đâu! Nhưng trong thử thách, Ngài sẽ mở đường cho ra khỏi, để anh em có thể chịu được.",
"행 1":"3 Ngài cũng dùng nhiều cách chứng tỏ cho các sứ đồ rằng Ngài đang sống sau khi đã chịu chết, và hiện đến với họ trong bốn mươi ngày, phán dạy về vương quốc Đức Chúa Trời.\n4 Trong khi họp mặt với các sứ đồ, Ngài dặn họ: “Đừng ra khỏi thành Giê-ru-sa-lem, nhưng phải ở đó chờ điều Cha đã hứa, là điều các con đã nghe Ta nói.\n5 Vì Giăng đã làm báp-têm bằng nước, nhưng trong ít ngày nữa, các con sẽ được báp-têm bằng Đức Thánh Linh.”\n8 Nhưng khi Đức Thánh Linh giáng trên các con thì các con sẽ nhận lấy quyền năng và làm chứng nhân cho Ta tại thành Giê-ru-sa-lem, cả xứ Giu-đê, xứ Sa-ma-ri cho đến cùng trái đất.”",
"마 4":"1 Sau đó, Thánh Linh đem Đức Chúa Jêsus vào hoang mạc để chịu ma quỷ cám dỗ.\n2 Sau khi kiêng ăn bốn mươi ngày và bốn mươi đêm, Ngài đói.\n3 Kẻ cám dỗ đến gần, nói với Ngài: “Nếu ngươi là Con Đức Chúa Trời, hãy khiến những đá nầy thành bánh đi.”\n4 Đức Chúa Jêsus đáp: “Có lời chép rằng: ‘Người ta sống chẳng phải chỉ nhờ bánh mà thôi, nhưng cũng nhờ mọi lời nói từ miệng Đức Chúa Trời.’ ”\n5 Ma quỷ đem Ngài vào thành thánh, đặt Ngài trên nóc đền thờ,\n6 và nói: “Nếu ngươi là Con Đức Chúa Trời, hãy lao mình xuống đi, vì có lời chép: ‘Chúa sẽ truyền lệnh cho các thiên sứ, Các đấng ấy sẽ đỡ nâng ngươi trên tay, E chân ngươi vấp phải đá chăng.’ ”\n7 Đức Chúa Jêsus phán: “Cũng có lời chép: ‘Ngươi đừng thách thức Chúa là Đức Chúa Trời ngươi.’ ”\n8 Ma quỷ lại đem Ngài lên đỉnh núi cao, chỉ cho Ngài thấy tất cả các vương quốc trên thế gian với sự huy hoàng của chúng,\n9 và nói: “Nếu ngươi sấp mình thờ lạy ta, ta sẽ cho ngươi tất cả những thứ nầy.”\n10 Đức Chúa Jêsus phán với nó rằng: “Hỡi Sa-tan, hãy lui ngay! Vì có lời chép rằng: ‘Ngươi phải thờ phượng Chúa là Đức Chúa Trời ngươi, và chỉ phụng sự một mình Ngài mà thôi.’ ”\n11 Ma quỷ bỏ đi, và kìa, các thiên sứ đến phục vụ Ngài.",
"마 12":"28 Còn nếu Ta nhờ Thánh Linh của Đức Chúa Trời mà đuổi quỷ, thì vương quốc Đức Chúa Trời đã đến với các ngươi rồi.\n29 Hay là, làm thế nào người ta có thể vào nhà một người có sức mạnh để cướp tài sản nếu trước hết không trói người ấy lại? Phải trói người ấy lại rồi mới cướp nhà người được.",
"행 19":"8 Phao-lô vào nhà hội, giảng dạy một cách dạn dĩ, biện luận và thuyết phục người nghe về vương quốc Đức Chúa Trời suốt ba tháng.\n9 Nhưng có mấy người ngoan cố, không chịu tin, lại còn gièm chê đạo Chúa trước mặt dân chúng nên ông rút lui khỏi họ, đem các môn đồ riêng ra, và hằng ngày thảo luận trong trường học của Ti-ra-nu.\n10 Việc nầy tiếp tục trong hai năm, đến nỗi mọi người ở A-si-a, cả người Do Thái lẫn người Hi Lạp, đều được nghe đạo Chúa.",
"빌 4":"20 Cầu xin vinh quang thuộc về Đức Chúa Trời, là Cha chúng ta đời đời vô cùng! A-men.",
"요 14":"3 Khi Ta đi và đã chuẩn bị chỗ cho các con rồi, Ta sẽ trở lại đem các con đi với Ta, để Ta ở đâu thì các con cũng ở đó.",
"딤후 3":"16 Cả Kinh Thánh đều được Đức Chúa Trời cảm thúc, có ích cho sự dạy dỗ, khiển trách, sửa trị và huấn luyện trong sự công chính,\n17 để người của Đức Chúa Trời được toàn vẹn và sẵn sàng cho mọi việc lành.",
"시 1":"1 Phước cho người nào Chẳng đi theo mưu kế của kẻ ác, Chẳng đứng trong đường tội nhân, Không ngồi chỗ của kẻ nhạo báng.\n2 Nhưng vui thích về luật pháp của Đức Giê-hô-va Và suy ngẫm luật pháp ấy ngày và đêm.\n3 Người ấy sẽ như cây trồng gần dòng nước, Sinh bông trái đúng mùa đúng tiết, Lá nó cũng chẳng tàn héo. Mọi việc người làm đều sẽ thịnh vượng.\n4 Kẻ ác chẳng như vậy đâu, Nhưng chúng khác nào rơm rác gió thổi bay đi.\n5 Vì thế, kẻ ác chẳng đứng nổi trong ngày phán xét, Tội nhân cũng không được vào hội người công chính.\n6 Vì Đức Giê-hô-va biết đường lối người công chính, Nhưng đường lối kẻ ác sẽ bị diệt vong.",
"갈 5":"16 Vậy tôi nói, hãy bước đi theo Thánh Linh, đừng thỏa mãn những dục vọng xác thịt.\n17 Vì xác thịt có những dục vọng trái ngược với Thánh Linh, và Thánh Linh có những ước muốn trái ngược với xác thịt; hai bên đối nghịch nhau như vậy, nên anh em không làm được điều mình muốn.\n18 Nhưng nếu anh em được Thánh Linh dắt dẫn thì chẳng ở dưới luật pháp đâu.\n19 Công việc của xác thịt thật rõ ràng, đó là: Gian dâm, ô uế, buông tuồng,\n20 thờ hình tượng, phù phép, thù oán, gây gổ, ghen ghét, giận dữ, ích kỷ, bất bình, phe đảng,\n21 ganh tị, say sưa, chè chén, và những việc tương tự khác. Tôi cảnh cáo anh em, như tôi đã từng cảnh cáo: Những ai làm các việc như thế sẽ không được hưởng vương quốc Đức Chúa Trời.\n22 Nhưng trái của Thánh Linh là: Yêu thương, vui mừng, bình an, nhịn nhục, nhân từ, hiền lành, trung tín, khiêm nhu, tiết độ.",
"삼상 16":"23 Từ đó trở đi, mỗi khi Đức Chúa Trời sai ác thần nhập vào Sau-lơ thì Đa-vít lấy đàn hạc đánh lên. Sau-lơ được khuây khỏa, thoải mái, và ác thần lìa khỏi ông.",
"대하 20":"22 Khi họ bắt đầu hát vang ca ngợi thì Đức Giê-hô-va cho quân mai phục tấn công đám quân đang tiến đánh Giu-đa gồm quân Am-môn, Mô-áp và người ở núi Sê-i-rơ, và khiến đám quân ấy bị thảm bại.",
"살전 5":"18 hãy cảm tạ Chúa trong mọi hoàn cảnh, vì đó là ý muốn của Đức Chúa Trời đối với anh em trong Đấng Christ Jêsus."

  return fn(ref,m.slice(cm.length),{cont:true,chg:!!ch,sep:cm})})}
function lookup(ref,src){
  src=src||D;
  var m=/^(\S+) (\d+):(\d+)(?:-(\d+))?$/.exec(ref); if(!m)return null;
  var key=m[1]+" "+m[2],ch=src[key]; if(!ch)return null;
  var map={};ch.split("\n").forEach(function(l){var i=l.indexOf(" ");map[l.slice(0,i)]=l.slice(i+1)});
  var a=+m[3],b=+(m[4]||m[3]),out=[],any=false;

  for(var v=a;v<=b;v++){if(map[v]){out.push([v,map[v]]);any=true}else out.push([v,null])}

}

}
var TL=T.split("\n"),GR={},NB=[];

TL.forEach(function(l,i){var m=RG.exec(l);if(m)GR[i]=m[1];if(l.trim())NB.push(i)});

if(typeof document!=="undefined"){
  var L=document.getElementById("list"),V=document.getElementById("view"),saved=0,pushed=false,lang="ko",curRef="";
