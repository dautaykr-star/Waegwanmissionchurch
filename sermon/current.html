<script type="text/plain" id="src-ko">
묵상시대, 대대의 영원한 규례(레23:39-44)

1.영원한 규례의 증인
1)노아-창8:20(번제)
2)아브라함-창13:18(제단)
3)이삭-창26:25(장막)
4)야곱-창35:1(벧엘 제단)
5)요셉-창50:24(가나안)
6)이스라엘-출3:18(희생제사)
7)사무엘-삼상7:10(번제)
8)다윗-삼하24:25(번제, 화목제)
9)솔로몬-왕상3:4(일천번제)
10)히스기야-왕하18:3
11)초대교회-행2:1-47

2.대대의 영원한 규례-레23:33-44
1)구원-유월절
(1)피 언약을 잊지 말라-창3:15, 출3:18
(2)임마누엘, 죄 사함, 마귀세력을 이기는 답
(3)복음 체질이 되는 절기
(4)잊으면 창3장에서 못 빠져 나온다
2)인도-오순절
(1)잠3:3-5 범사에 그를 인정하라
(2)막3:13-15 함께하신다는 약속
(3)마28:20세상 끝 날 까지
(4)고전10:13  피할 길
(5)행1:8, 2:1  땅 끝까지 증인으로
3)나라-추수절
(1)마4:1-11사단의 시험
(2)마12:28-29 사단 결박
(3)행1:3-5, 8 하나님나라, 성령충만
(4)행19:8-10  말씀운동
(5)빌4:20 하나님께 영광
(6)요14:3 천국

3.영원한 규례의 축복
1)말씀-하나님의 말씀이 들려지는 시간(딤후3:16-17)
(1)말씀, 메시지, 복음의 비밀 전달
(2)하나님의 중심, 계획, 뜻 전달
(3)하나님의 감동의 전달
2)기도-말씀잡고 기도하는 시간(시1:1-6, 갈5:16-21)
(1)육신의 일을 내려놓고 하나님을 바라보는 시간
(2)성령충만의 열매(갈5:22)
(3)말씀 묵상, 이미 주신응답을 누리는 시간
3)찬양-평화와 능력이 임하는 시간
(1)삼상16:23-악신결박
(2)대하20:22-대적정복
(3)살전5:18-범사에 감사

<script type="text/plain" id="src-vi">
Thời đại suy ngẫm: Quy định đời đời cho mọi thế hệ ({레23:39-44|Lê-vi 23:39-44})

1. Những chứng nhân của quy định đời đời
1) Nô-ê – {창8:20|Sáng-thế 8:20} (tế lễ thiêu)
2) Áp-ra-ham – {창13:18|Sáng-thế 13:18} (bàn thờ)
3) Y-sác – {창26:25|Sáng-thế 26:25} (lều)
4) Gia-cốp – {창35:1|Sáng-thế 35:1} (bàn thờ Bê-tên)
5) Giô-sép – {창50:24|Sáng-thế 50:24} (Ca-na-an)
6) Y-sơ-ra-ên – {출3:18|Xuất 3:18} (tế lễ hiến sinh)
7) Sa-mu-ên – {삼상7:10|1 Sa-mu-ên 7:10} (tế lễ thiêu)
8) Đa-vít – {삼하24:25|2 Sa-mu-ên 24:25} (tế lễ thiêu, tế lễ bình an)
9) Sa-lô-môn – {왕상3:4|1 Các Vua 3:4} (một nghìn tế lễ thiêu)
10) Ê-xê-chia – {왕하18:3|2 Các Vua 18:3}
11) Hội Thánh đầu tiên – {행2:1-47|Công vụ 2:1-47}

2. Quy định đời đời cho mọi thế hệ – {레23:33-44|Lê-vi 23:33-44}
1) Sự cứu rỗi – Lễ Vượt Qua
(1) Đừng quên giao ước huyết – {창3:15|Sáng-thế 3:15}, {출3:18|Xuất 3:18}
(2) Em-ma-nu-ên, sự tha tội, câu trả lời để chiến thắng thế lực ma quỷ
(3) Kỳ lễ giúp ta có thể chất Tin Lành
(4) Nếu quên thì không thể thoát ra khỏi Sáng-thế Ký chương 3
2) Sự dẫn dắt – Lễ Ngũ Tuần
(1) {잠3:3-5|Châm ngôn 3:3-5} Trong mọi đường lối hãy nhận biết Ngài
(2) {막3:13-15|Mác 3:13-15} Lời hứa Ngài ở cùng chúng ta
(3) {마28:20|Ma-thi-ơ 28:20} Cho đến tận thế
(4) {고전10:13|1 Cô-rinh-tô 10:13} Đường ra khỏi thử thách
(5) {행1:8, 2:1|Công vụ 1:8; 2:1} Làm chứng cho đến cùng trái đất
3) Vương quốc – Lễ Mùa Gặt
(1) {마4:1-11|Ma-thi-ơ 4:1-11} Sự cám dỗ của Sa-tan
(2) {마12:28-29|Ma-thi-ơ 12:28-29} Trói Sa-tan
(3) {행1:3-5, 8|Công vụ 1:3-5, 8} Vương quốc Đức Chúa Trời, đầy dẫy Thánh Linh
(4) {행19:8-10|Công vụ 19:8-10} Phong trào Lời Chúa
(5) {빌4:20|Phi-líp 4:20} Vinh quang cho Đức Chúa Trời
(6) {요14:3|Giăng 14:3} Thiên đàng

3. Phước lành của quy định đời đời
1) Lời Chúa – thời gian Lời Đức Chúa Trời được nghe ({딤후3:16-17|2 Ti-mô-thê 3:16-17})
(1) Truyền đạt Lời, thông điệp, mầu nhiệm của Tin Lành
(2) Truyền đạt tấm lòng, kế hoạch, ý muốn của Đức Chúa Trời
(3) Truyền đạt sự cảm thúc của Đức Chúa Trời
2) Cầu nguyện – thời gian nắm giữ Lời mà cầu nguyện ({시1:1-6|Thi thiên 1:1-6}, {갈5:16-21|Ga-la-ti 5:16-21})
(1) Thời gian buông bỏ việc xác thịt và ngước nhìn Đức Chúa Trời
(2) Bông trái của sự đầy dẫy Thánh Linh ({갈5:22|Ga-la-ti 5:22})
(3) Thời gian suy ngẫm Lời và hưởng sự đáp lời đã ban
3) Ngợi khen – thời gian bình an và quyền năng giáng xuống
(1) {삼상16:23|1 Sa-mu-ên 16:23} – Trói ác thần
(2) {대하20:22|2 Sử ký 20:22} – Chinh phục kẻ thù
(3) {살전5:18|1 Tê-sa-lô-ni-ca 5:18} – Tạ ơn trong mọi sự
</script>

"레23:41": "Mỗi năm, vào tháng bảy các con phải giữ lễ nầy cho Đức Giê-hô-va trong bảy ngày. Đây là quy định đời đời cho mọi thế hệ của các con.",
"레23:42": "Các con phải ở trong lều bảy ngày. Tất cả những người sinh ra là dân Y-sơ-ra-ên đều phải ở trong lều,",
"레23:43": "để mọi thế hệ các con biết rằng khi Ta đem dân Y-sơ-ra-ên ra khỏi Ai Cập, Ta đã cho họ ở trong các lều trại. Ta là Giê-hô-va Đức Chúa Trời của các con.’”",
"레23:44": "Vậy Môi-se truyền dạy cho dân Y-sơ-ra-ên biết giữ các ngày lễ Đức Giê-hô-va đã ấn định.",
"창8:20": "Bấy giờ Nô-ê lập một bàn thờ cho Đức Giê-hô-va. Ông bắt các loài thú thanh sạch và các loài chim thanh sạch làm tế lễ thiêu dâng lên bàn thờ.",
"창13:18": "Áp-ram dời trại đến định cư gần những cây sồi của Mam-rê, thuộc Hếp-rôn, và lập tại đó một bàn thờ cho Đức Giê-hô-va.",
"창26:25": "Y-sác lập một bàn thờ, cầu khẩn danh Đức Giê-hô-va và đóng trại tại đó. Rồi các đầy tớ của ông đào ở đó một cái giếng.",
"창35:1": "Đức Chúa Trời phán với Gia-cốp: “Hãy mau đi lên Bê-tên và ở đó. Cũng hãy lập tại đó một bàn thờ cho Đức Chúa Trời, là Đấng đã hiện ra với con khi con chạy trốn anh con là Ê-sau.”",
"창50:24": "Giô-sép nói với các anh em: “Tôi sắp qua đời, nhưng chắc chắn Đức Chúa Trời sẽ thăm viếng anh em, đem anh em ra khỏi xứ nầy để trở về xứ mà Ngài đã thề hứa với Áp-ra-ham, Y-sác, và Gia-cốp.”",
"출3:18": "Họ sẽ vâng theo lời con. Vậy con và các trưởng lão Y-sơ-ra-ên hãy đi yết kiến vua Ai Cập và nói rằng: ‘Giê-hô-va, Đức Chúa Trời của dân Hê-bơ-rơ, đã hiện ra với chúng tôi. Bây giờ, xin bệ hạ cho chúng tôi đi ba ngày đường vào hoang mạc để dâng sinh tế cho Giê-hô-va Đức Chúa Trời chúng tôi.’",
"삼상7:10": "Trong lúc Sa-mu-ên dâng tế lễ thiêu, người Phi-li-tin kéo đến gần để giao chiến với Y-sơ-ra-ên. Nhưng trong ngày đó Đức Giê-hô-va khiến sấm sét nổ vang trên người Phi-li-tin, làm cho chúng hỗn loạn, và chúng bị đánh bại trước mặt người Y-sơ-ra-ên.",
"삼하24:25": "Đa-vít xây tại đó một bàn thờ cho Đức Giê-hô-va, và dâng tế lễ thiêu cùng tế lễ bình an. Đức Giê-hô-va nhậm lời cầu nguyện và chấm dứt tai họa trên đất nước Y-sơ-ra-ên.",
"왕상3:4": "Vua đi đến Ga-ba-ôn để dâng sinh tế tại đó vì ấy là nơi cao quan trọng nhất. Trên bàn thờ đó, Sa-lô-môn dâng một nghìn sinh tế làm tế lễ thiêu.",
"왕하18:3": "Vua làm điều ngay thẳng dưới mắt Đức Giê-hô-va như Đa-vít, tổ phụ vua, đã làm.",
"행2:1": "Đến ngày lễ Ngũ Tuần, các môn đồ nhóm họp tại một chỗ.",
"행2:2": "Thình lình, có tiếng động từ trời đến như tiếng gió thổi ào ào, đầy khắp nhà môn đồ ngồi.",
"행2:3": "Các môn đồ thấy những lưỡi như lưỡi lửa xuất hiện, tản ra và đậu trên mỗi người trong họ.",
"행2:4": "Tất cả đều được đầy dẫy Đức Thánh Linh, bắt đầu nói các ngôn ngữ khác, theo như Thánh Linh cho họ nói.",
"행2:5": "Bấy giờ có những người Do Thái sùng đạo từ các dân trong thiên hạ về, đang lưu trú tại Giê-ru-sa-lem.",
"행2:6": "Khi nghe tiếng ấy, dân chúng kéo đến và sửng sốt vì mỗi người đều nghe các môn đồ nói tiếng bản xứ của mình.",
"행2:7": "Họ rất ngạc nhiên và hỏi nhau: “Tất cả những người đang nói đó không phải là người Ga-li-lê sao?",
"행2:8": "Vậy sao mỗi người chúng ta đều nghe họ nói tiếng bản xứ của mình?",
"행2:9": "Nào người Bạt-thê, Mê-đi, Ê-la-mít, kẻ ở tại Mê-sô-pô-ta-mi, Giu-đê, Cáp-pa-đốc, Pông, A-si-a,",
"행2:10": "Phi-ri-gi, Pam-phi-ly, Ai Cập, các vùng thuộc Li-by gần Sy-ren; nào du khách từ Rô-ma đến,",
"행2:11": "cả người Do Thái hoặc người theo đạo Do Thái, người Cơ-rết và Ả-rập nữa, chúng ta đều nghe họ dùng ngôn ngữ chúng ta mà nói về những việc quyền năng của Đức Chúa Trời.”",
"행2:12": "Mọi người đều kinh ngạc và bối rối, nói với nhau: “Việc nầy có nghĩa gì?”",
"행2:13": "Nhưng có kẻ lại chế giễu rằng: “Họ say rượu mới rồi đó.”",
"행2:14": "Nhưng Phi-e-rơ đứng với mười một sứ đồ, lên tiếng nói với dân chúng: “Thưa anh em là người Do Thái và tất cả những người ở Giê-ru-sa-lem! Hãy biết rõ điều nầy và lắng tai nghe lời tôi nói:",
"행2:15": "Những người nầy chẳng phải say như anh em tưởng đâu, vì bây giờ mới là chín giờ sáng ban ngày!",
"행2:16": "Nhưng đây là điều Chúa đã phán qua nhà tiên tri Giô-ên:",
"행2:17": "‘Đức Chúa Trời phán: Trong những ngày cuối cùng, Ta sẽ đổ Thánh Linh Ta trên mọi xác thịt; Con trai và con gái các ngươi sẽ nói tiên tri, Thanh niên sẽ thấy khải tượng, Và người già sẽ thấy chiêm bao.",
"행2:18": "Phải, trong những ngày đó, Ta sẽ đổ Thánh Linh Ta trên các đầy tớ trai và gái Ta, Và họ sẽ nói tiên tri;",
"행2:19": "Ta lại sẽ làm các phép mầu ở trên trời, Và dấu lạ ở dưới đất; tức là máu, lửa, và luồng khói;",
"행2:20": "Mặt trời sẽ trở nên tối tăm, Mặt trăng sẽ hóa ra máu, Trước ngày vĩ đại và vinh quang của Chúa đến.",
"행2:21": "Và ai cầu khẩn danh Chúa thì sẽ được cứu.’",
"행2:22": "Thưa đồng bào Y-sơ-ra-ên, xin hãy nghe tôi nói đây: Đức Chúa Jêsus người Na-xa-rét đã được Đức Chúa Trời xác chứng trước anh em bằng những việc quyền năng, các phép mầu và dấu lạ. Qua Ngài, Đức Chúa Trời đã thực hiện những điều đó giữa anh em như chính anh em đều biết rõ.",
"행2:23": "Ngài đã bị phản nộp theo kế hoạch đã định và sự biết trước của Đức Chúa Trời, các ông đã mượn tay những kẻ gian ác đóng đinh Ngài trên thập tự giá và giết đi.",
"행2:24": "Nhưng Đức Chúa Trời đã khiến Ngài sống lại, giải thoát Ngài khỏi nỗi thống khổ của sự chết, vì nó không thể cầm giữ Ngài được.",
"행2:25": "Bởi Đa-vít có nói về Ngài: ‘Tôi luôn thấy Chúa ở trước mặt tôi, Vì Ngài ở bên phải tôi, nên tôi không hề bị rúng động.",
"행2:26": "Do đó, lòng tôi vui vẻ, lưỡi tôi mừng rỡ, Và thể xác tôi cũng sẽ an nghỉ trong hi vọng.",
"행2:27": "Vì Chúa sẽ không bỏ linh hồn tôi nơi âm phủ, Cũng không để cho Đấng Thánh
